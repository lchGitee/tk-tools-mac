// v1.12.52 选择推流视频素材（手机流接管时观众看到此视频；同步加入画面编辑器图层互通）
async function choosePushVideo(id) {
  const acc = state.accounts.find(a => String(a.id) === String(id));
  if (!acc) return;
  try {
    const path = await window.tkAPI.openFile([{ name: '视频文件', extensions: ['mp4', 'mov', 'mkv', 'avi', 'flv', 'webm'] }]);
    if (path && typeof path === 'string') {
      acc.pushVideo = path;
      // 互通：同步加入画面编辑器视频图层（画面编辑里也能看到/管理该素材）
      const sc = getScene(id);
      if (!sc.layers) sc.layers = [];
      sc.layers = sc.layers.filter(l => !String((l && l.id) || '').startsWith('push_'));
      const layerId = 'push_' + Date.now();
      const newLayer = {
        id: layerId, type: 'video', name: '推流素材',
        filePath: path, loop: true, volume: 1, playing: true,
        x: 0, y: 0, width: 720, height: 1280,
        rotation: 0, flipH: false, flipV: false,
      };
      sc.layers.push(newLayer);
      sc.selectedLayerId = layerId;
      // 同步创建视频元素（画面编辑/推流渲染依赖 videoElements[layer.id]，缺失会黑屏）
      const video = document.createElement('video');
      video.src = 'file://' + path.replace(/\\/g, '/').replace(/ /g, '%20').replace(/#/g, '%23');
      video.crossOrigin = 'anonymous';
      video.loop = true;
      video.muted = true;
      video.volume = 1;
      video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
      videoElements[layerId] = video;
      video.onloadedmetadata = () => {
        const ratio = video.videoWidth / video.videoHeight;
        if (ratio > 720 / 1280) {
          newLayer.width = 720; newLayer.height = 720 / ratio; newLayer.y = (1280 - newLayer.height) / 2;
        } else {
          newLayer.height = 1280; newLayer.width = 1280 * ratio; newLayer.x = (720 - newLayer.width) / 2;
        }
        if (state.currentRoute === 'editor') render();
      };
      video.onerror = () => {
        showToast('推流视频无法解码：' + path.split(/[\\/]/).pop() + '，请换用 H.264 编码的 MP4', 'error');
        addLog('推流视频解码失败: ' + path);
      };
      saveScene(id, sc);
      saveState();
      render();
      startCanvasEngine();
      showToast('已选择推流素材并加入画面编辑: ' + path.split(/[\\/]/).pop(), 'success');
      addLog('账号 ' + acc.name + ' 已选择推流素材（已同步画面编辑）: ' + path);
    }
  } catch (e) { showToast('选择视频失败: ' + e.message, 'error'); }
}

  const node = {

async function syncNodesToMain() {
  if (isElectron && window.tkAPI && window.tkAPI.saveNodes) {
    try {
      const result = await window.tkAPI.saveNodes({ nodes: state.nodes.map(n => ({ id: n.id, name: n.name, link: n.url })) });
      if (!result.ok) throw new Error(result.error);
      addLog('节点配置已同步，内置代理已更新');
    } catch (error) {
      addLog('内置代理启动失败: ' + error.message);
      showToast('内置代理启动失败: ' + error.message, 'error');
    }
  }
}

async function doTestNode(node) {
  node.status = 'testing';
  node.testResult = '';
  saveState();
  render();
  addLog('测试节点: ' + node.name);
  if (isElectron && window.tkAPI) {
    const res = await window.tkAPI.testNode({ url: node.url });
    if (res && res.success) {
      node.status = 'connected';
      node.ip = res.ip || 'unknown';
      node.ping = res.ping || 0;
      node.downMBps = res.downMBps || 0;
      node.upMBps = res.upMBps || 0;
      node.testResult = '';
      showToast('节点测试通过 · 出口 ' + node.ip + ' · 延迟 ' + node.ping + ' ms · 下行 ' + node.downMBps + ' MB/s', 'success');
      addLog('节点 ' + node.name + ' 测试通过，出口 IP: ' + node.ip + '，延迟 ' + node.ping + ' ms，下行 ' + node.downMBps + ' MB/s，上行 ' + node.upMBps + ' MB/s');
    } else {
      node.status = 'error';
      node.testResult = (res && res.error) || '测试失败';
      node.ip = '';
      node.ping = 0;
      node.downMBps = 0;
      node.upMBps = 0;
      showToast('节点测试失败: ' + (res && res.error), 'error');
      addLog('节点 ' + node.name + ' 测试失败: ' + (res && res.error));
    }
  } else {
    node.status = 'error';
    node.testResult = '仅桌面版支持真实测试';
    showToast('仅桌面版支持真实节点测试', 'warning');
  }
  saveState();
  render();
}

function testNode(id) {

  if (node.status === 'testing') return;

}

// v1.14.7 测试全部节点（逐节点真实测速：出口 IP / 延迟 / 下行 / 上行），完成后弹窗汇总
async function testAllNodes() {
  if (!state.nodes.length) { showToast('暂无节点', 'warning'); return; }
  if (state.nodes.some(n => n.status === 'testing')) { showToast('已有节点在测试中，请稍候', 'warning'); return; }
  showToast('开始测试全部 ' + state.nodes.length + ' 个节点（每个约 10-20 秒）...', 'info');
  addLog('开始测试全部节点 (' + state.nodes.length + ' 个)');
  const rows = [];
  for (const n of [...state.nodes]) {
    await doTestNode(n);
    rows.push({ name: n.name, ok: n.status === 'connected', ip: n.ip || '', ping: n.ping || 0, down: n.downMBps || 0, up: n.upMBps || 0, error: n.status === 'error' ? (n.testResult || '失败') : '' });
  }
  const okCount = rows.filter(r => r.ok).length;
  const html = rows.map(r => `
    <div style="padding:8px 0;border-bottom:1px solid var(--border-light);font-size:12px;line-height:1.8">
      <div style="font-weight:700">${escapeHtml(r.name)} <span style="color:${r.ok ? '#2ea043' : '#f85149'}">${r.ok ? '✅ 可用' : '❌ 不可用'}</span></div>

    </div>`).join('');
  showModal('节点测试结果（' + okCount + '/' + rows.length + ' 可用）', html, [{ text: '关闭', class: 'btn-secondary' }]);
}

function toggleMonitor(id) {
  const acc = state.accounts.find(a => String(a.id) === String(id));
  if (!acc) return;
  if (acc.monitorRunning) {
    if (window.tkAPI && window.tkAPI.stopMonitor) window.tkAPI.stopMonitor({ accountId: id });
    acc.monitorRunning = false;
    addLog('房间' + id + (acc.name ? ' @' + acc.name : '') + ' 实时监控已停止');
  } else {
    if (!acc.name) {
      showToast('请先登录账号并确认账号名后再开启监控', 'error');
      return;
    }
    if (!window.tkAPI || !window.tkAPI.startMonitor) {
      showToast('当前为非桌面环境，无法开启监控', 'error');
      return;
    }
    acc.monitorRunning = true;
    saveState();
    render();
    // v1.11.0 不再内嵌弹窗：监控窗口为独立窗口（可拖出软件页面外），主界面只聚焦它
    if (window.tkAPI && window.tkAPI.monitorFocusUI) window.tkAPI.monitorFocusUI({ accountId: id });
    addLog('房间' + id + (acc.name ? ' @' + acc.name : '') + ' 正在启动实时监控（IM互动+风险扫描）...');
    window.tkAPI.startMonitor({ accountId: id, accountName: acc.name }).then(r => {
      if (r && r.success) {
        acc.monitorRunning = true;
        if (window.tkAPI && window.tkAPI.monitorFocusUI) window.tkAPI.monitorFocusUI({ accountId: id });
        addLog('房间' + id + ' 实时监控已开启' + (r.roomId ? '，直播间 ' + r.roomId : '') + '（独立监控窗口已弹出，可拖出软件页面）');
      } else {
        acc.monitorRunning = false;
        addLog('房间' + id + ' 监控启动失败: ' + (r && r.error ? r.error : '未知错误'));
      }
      saveState();
      render();
      updateMonitorPanel(id);
    });
  }
  saveState();
  render();
}

// v1.9.0 每房间独立监控弹窗（实时动态+互动计数+风险告警合一）
// 每个房间一个独立浮动面板，多房间可同时打开，各自独立数据

const monitorPanels = {};  // accountId -> { el, minimized }

// v1.9.2 直播时长格式化
function formatLiveDuration(sec) {
  if (!sec || sec < 0) return '--:--';
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const pad = n => String(n).padStart(2, '0');
  return (h > 0 ? pad(h) + ':' : '') + pad(m) + ':' + pad(s);
}
// v1.9.2 每1秒刷新所有已打开监控面板的直播时长
function startLiveTicker() {
  if (window._liveTicker) return;
  window._liveTicker = setInterval(() => {
    Object.keys(monitorPanels).forEach(idStr => {
      const id = Number(idStr);
      const acc = state.accounts.find(a => String(a.id) === String(id));
      const node = monitorPanels[id] && monitorPanels[id].el.querySelector('#mpx-live-' + id);
      if (!node) return;
      if (acc && acc.streaming && acc.liveStartedAt) {
        node.textContent = formatLiveDuration((Date.now() - acc.liveStartedAt) / 1000);
        node.style.color = '#047857';
      } else {
        node.textContent = '--:--';
        node.style.color = 'var(--text-secondary)';
      }
    });
  }, 1000);
}
// v1.9.2 复制观众直播间链接（@user/live 会自动跳转到软件推流的当前直播间）
function copyLiveLink(id) {
  const acc = state.accounts.find(a => String(a.id) === String(id));
  if (!acc || !acc.name) { showToast('该房间未登录，无法生成链接', 'error'); return; }
  const url = 'https://www.tiktok.com/@' + acc.name + '/live';
  const done = () => { showToast('观众链接已复制：' + url, 'success'); addLog('房间' + id + ' 已复制观众链接 ' + url); };
  // v1.12.16 file:// 下 navigator.clipboard 可能挂起（promise 不回调→看起来没反应）：包裹 try 并兜底 fallbackCopy
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done).catch(() => { fallbackCopy(url); done(); });
    } else { fallbackCopy(url); done(); }
  } catch (e) { fallbackCopy(url); done(); }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}

    const rect = el.getBoundingClientRect();
    const startX = e.clientX, startY = e.clientY, origX = rect.left, origY = rect.top;

    const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

}

function toggleMinMonitor(id) {
  const p = monitorPanels[id];
  if (!p) return;
  p.minimized = !p.minimized;
  p.el.classList.toggle('minimized', p.minimized);
}
function closeMonitorPanel(id) {
  const p = monitorPanels[id];
  if (!p) return;
  p.el.remove();
  delete monitorPanels[id];
}
function toggleMonitorFromPanel(id) {
  toggleMonitor(id);
}

function updateMonitorPanel(id) {
  const p = monitorPanels[id];
  const acc = state.accounts.find(a => String(a.id) === String(id));
  if (!p || !acc) return;
  const el = p.el;
  const m = acc.metrics;
  ['online','likes','gifts','follows','enters','comments'].forEach(k => {
    const node = el.querySelector('#mpx-' + k + '-' + id);
    if (node) node.textContent = formatNum(m[k] || 0);
  });
  const dot = el.querySelector('#mon-dot-' + id);
  if (dot) dot.className = 'dot' + (acc.monitorRunning ? ' live' : '');
  const btn = el.querySelector('#mpx-btn-' + id);
  if (btn) { btn.textContent = acc.monitorRunning ? '停止监控' : '开启监控'; btn.className = 'btn btn-sm ' + (acc.monitorRunning ? 'btn-danger' : 'btn-success'); }
  const feed = el.querySelector('#mpx-feed-' + id);
  if (feed && feed.dataset.initialized !== '1') {
    feed.dataset.initialized = '1';
    feed.innerHTML = (acc.feed && acc.feed.length) ? acc.feed.slice(-30).reverse().map(feedItemHtml).join('') : '<div class="feed-empty">暂无实时动态<br><span style="font-size:11px">进场、评论、礼物、风险告警都会显示在这里</span></div>';
  }
  const risk = el.querySelector('#mpx-risk-' + id);
  if (risk && risk.dataset.initialized !== '1') {
    risk.dataset.initialized = '1';
    risk.innerHTML = (acc.risks && acc.risks.length) ? acc.risks.slice(-10).reverse().map(riskItemHtml).join('') : '<div class="mon-panel-empty-note">暂无风险告警</div>';
  }
}

function feedItemHtml(item) {
  return `<div class="feed-item"><span class="feed-type ${item.type}">${typeLabel(item.type)}</span><div class="feed-content">${item.user ? '<span class="feed-user">' + escapeHtml(item.user) + '</span> ' : ''}<span class="feed-text">${escapeHtml(item.text || '')}</span></div></div>`;
}
function riskItemHtml(r) {
  const cls = r.severity === 'high' ? ' high' : '';
  return `<div class="mon-risk-item${cls}"><span class="t">${escapeHtml(r.cn || '风险告警')}</span> · ${escapeHtml((r.detail || '').slice(0, 60))}<div style="font-size:11px;color:var(--text-tertiary);margin-top:2px">${new Date(r.ts || Date.now()).toLocaleTimeString()} ${escapeHtml((r.advice || '').slice(0, 40))}</div></div>`;
}

function appendPanelFeed(id, item) {
  const p = monitorPanels[id];
  if (!p) return;
  const feed = p.el.querySelector('#mpx-feed-' + id);

  const empty = feed.querySelector('.feed-empty');
  if (empty) feed.innerHTML = '';
  const div = document.createElement('div');
  div.innerHTML = feedItemHtml(item);
  feed.insertBefore(div.firstChild, feed.firstChild);
  while (feed.children.length > 50) feed.removeChild(feed.lastChild);
}

function appendPanelRisk(id, risk) {
  const p = monitorPanels[id];
  if (!p) return;
  const box = p.el.querySelector('#mpx-risk-' + id);
  if (!box) return;
  const empty = box.querySelector('.mon-panel-empty-note');
  if (empty) box.innerHTML = '';
  const div = document.createElement('div');
  div.innerHTML = riskItemHtml(risk);
  box.insertBefore(div.firstChild, box.firstChild);
  while (box.children.length > 20) box.removeChild(box.lastChild);

// v1.8.0：IM 互动事件（主进程推送）
function handleImEvents(data) {
  // v1.13.17 String 兼容 id 匹配（主进程 accountId 为字符串，state.accounts id 可能被解析为数字 → 匹配失败 → 面板永不更新）
  const acc = state.accounts.find(a => String(a.id) === String(data.accountId));
  if (!acc) {
    try { addLog('[实时动态] 房间' + data.accountId + ' 未找到账号卡片（id=' + data.accountId + ' 类型匹配失败）'); } catch (e) {}
    return;
  }
  // v1.13.16 强诊断：前端收到事件立即记日志（软件日志面板可见，定位"主进程推了但面板不显示"）
  try { addLog('[实时动态] 房间' + data.accountId + ' 收到 ' + (data.items || []).length + ' 条: ' + (data.items || []).map(i => i.type + ':' + (i.user || '') + (i.text ? ':' + i.text.slice(0, 20) : '')).join(', ')); } catch (e) {}
  // v1.15.31 在线每次实时更新：DOM 在线源已干净（room-header 门控 + 直播已结束全文检测，不再横跳）——观众数变化实时跟随，去掉一次性限制
  (data.items || []).forEach(item => {
    acc.feed.push(item);
    if (acc.feed.length > 200) acc.feed.shift();
    if (item.type === 'comment') acc.metrics.comments++;
    else if (item.type === 'like') {
      // v1.12.30 点赞总数事件（isTotal）直接设为直播间真实点赞数；行为点赞事件按 likeCount 累加
      // v1.15.32 点赞只增不减（页面重载抓到旧值不回落）：取当前值与新值的较大者
      if (item.isTotal) acc.metrics.likes = Math.max(acc.metrics.likes || 0, item.likeCount || 0);
      else acc.metrics.likes += (item.likeCount || 1);
    }
    else if (item.type === 'gift') acc.metrics.gifts += (item.giftCount || 1); // v1.13.29 ×N 累加：送 3 个礼物 +3
    else if (item.type === 'follow') acc.metrics.follows++;
    else if (item.type === 'enter') acc.metrics.enters++;
    else if (item.type === 'online') { acc.metrics.online = parseInt(item.text.replace(/[^0-9]/g, '')) || 0; }
    // v1.9.0 独立面板实时追加（点赞总数事件只更新指标，不进动态流）
    if (item.type !== 'online' && !item.isTotal) appendPanelFeed(data.accountId, item);
  });
  // 在线（主进程 DOM 实时值）：有值就更新（0 也更新——观众走光归 0）
  if (data.online !== undefined && data.online !== null && data.online !== '') { acc.metrics.online = data.online || 0; }
  saveState();
  render();
  updateMonitorPanel(data.accountId);
  // v1.9.0 语音播报（礼物/关注/评论，评论节流）
  const items = data.items || [];
  const talk = items.find(i => i.type === 'gift') || items.find(i => i.type === 'follow');
  const cmt = items.find(i => i.type === 'comment');
  if (talk) ttsAnnounce((talk.type === 'gift' ? '礼物 ' : '关注 ') + (talk.user || ''));
  else if (cmt && state.broadcast) ttsAnnounce((cmt.user ? cmt.user + ' 评论 ' : '评论 ') + cmt.text);
  const summary = items.map(i => {
    const who = i.user ? i.user + ' ' : '';
    if (i.isTotal) return '';
    if (i.type === 'comment') return '评论 ' + who + (i.text || '');
    if (i.type === 'gift') return '礼物 ' + who + (i.text || '');
    if (i.type === 'enter') return '进场 ' + who;
    if (i.type === 'follow') return '关注 ' + who;
    if (i.type === 'online') return i.text;
    return i.type + (i.text ? ' ' + i.text : '');
  }).filter(Boolean).join('；');
  if (summary) addLog('房间' + data.accountId + ' ' + summary);
}

// v1.8.0：风险告警（主进程推送，官方通道分类）
// v1.14.11 风险告警已停用（用户反馈数据不准确、误报多）：主进程不再发送，此处直接忽略（保留函数以防将来恢复）
function handleRiskWarning(data) {
  return;
  // ---------- 以下为原逻辑（已停用）----------
  const acc = state.accounts.find(a => String(a.id) === String(data.accountId));
  const risk = data.risk || {};

  if (acc) {
    acc.feed.push({ type: 'risk', user: '', text: (risk.cn || '风险告警') + ' · ' + (risk.detail || ''), ts: Date.now() });
    if (acc.feed.length > 200) acc.feed.shift();
    if (!acc.risks) acc.risks = [];

  // 弹窗提示（原因+建议+严重级）

// v1.12.43 手机下播提醒（醒目横幅 + 蜂鸣；不抢其他程序焦点）
let phoneDownAccountId = 5;
function handlePhoneDownRemind(data) {
  const banner = document.getElementById('phoneDownBanner');
  if (!banner) return;
  if (data && data.accountId) phoneDownAccountId = data.accountId;
  if (data && data.done) {
    banner.style.display = 'none';

    return;
  }
  const acc = state.accounts.find(a => String(a.id) === String(data.accountId));

  addLog('[提醒] ' + (data && data.msg || '请手动在手机端下播') + (acc && acc.name ? ' @' + acc.name : ''));
  // 蜂鸣提醒（不依赖系统音量设置，浏览器音频）
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.frequency.value = 880; g.gain.value = 0.25;
    o.connect(g); g.connect(ctx.destination);
    o.start(); setTimeout(() => { o.stop(); ctx.close(); }, 900);
  } catch (e) {}

function handleMonitorCleared(data) {
  const acc = state.accounts.find(a => String(a.id) === String(data.accountId));
  if (!acc) return;
  const reason = String(data.reason || '');
  if (reason.indexOf('监控已停止') >= 0) {
    acc.metrics = { online: 0, likes: 0, gifts: 0, follows: 0, enters: 0, comments: 0 };
    acc._likeUsers = {};
    acc.feed = [];
    acc.risks = [];
    saveState();
    render();
    updateMonitorPanel(data.accountId);
    addLog('房间' + data.accountId + ' ' + (reason || '监控已停止') + '，实时数据已清零');
  } else {
    // 下播/结束/切换：数据保留，仅暂停记录（面板数字停住不动，不丢失）
    // v1.15.34 在线是跟随型数据（跟着观众数实时加减），暂停/下播 → 在线归 0（其余累计型数字保留不动）
    if (acc.metrics && acc.metrics.online !== 0) {
      acc.metrics.online = 0;
      saveState();
    }
    updateMonitorPanel(data.accountId);
    addLog('房间' + data.accountId + ' ' + (reason || '直播状态变化') + '，实时数据已暂停记录（数据保留，仅停止监控时清零）');
  }
}

// v1.9.0 语音播报（TTS，本地合成，不依赖网络）
const ttsState = { lastTalkTs: 0 };
function ttsAnnounce(text, force) {
  if (!state.broadcast && !force) return;
  try {
    if (!window.speechSynthesis) return;
    const now = Date.now();
    if (!force && now - ttsState.lastTalkTs < 20000) return; // 普通播报 20s 节流
    ttsState.lastTalkTs = now;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).slice(0, 120));
    u.lang = 'zh-CN'; u.rate = 1; u.volume = 0.9;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function showModal(title, bodyHtml, buttons, extraClass) {

    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal ${extraClass || ''}">

          <div>

// ============================================================
// 实时数据说明
// ============================================================
// 本版本零模拟数据：在线/点赞/礼物/评论等全部等待真实事件。
// 房间登录后在「打开直播间」的独立窗口中查看真实数据，

// ============================================================
// Canvas 画面编辑器引擎
// ============================================================
const videoElements = {};  // layerId -> video element
const imageElements = {};  // layerId -> image element
const offscreenCanvases = {}; // accountId -> 离屏输出画布（推流用，不依赖当前页面）
let canvasRenderRunning = false;
let lastFrameTime = 0;
let frameCount = 0;
let fpsLastUpdate = 0;

function getOffscreenCanvas(accountId) {
  if (!offscreenCanvases[accountId]) {
    const c = document.createElement('canvas');
    c.width = 720;
    c.height = 1280;
    offscreenCanvases[accountId] = c;
  }
  return offscreenCanvases[accountId];
}

function triggerFileInput(accId) {
  // 每个房间使用独立的文件选择 input（避免多房间 id 冲突导致素材加到别的房间）

}

function handleLayerFileUpload(accId, file) {
  if (!file) return;
  const scene = getScene(accId);
  const isVideo = file.type.startsWith('video/');
  const url = URL.createObjectURL(file);
  // 真实文件路径：视频原声推流需要（webUtils.getPathForFile）
  let filePath = '';
  try { filePath = window.tkAPI.getPathForFile ? window.tkAPI.getPathForFile(file) : ''; } catch (e) { filePath = ''; }
  const layerId = state.nextLayerId++;

  const layer = {
    id: layerId,
    name: file.name.replace(/\.[^.]+$/, '').substring(0, 20),
    fileName: file.name,
    filePath: filePath,
    type: isVideo ? 'video' : 'image',
    src: url,
    x: 0, y: 0,
    width: 720, height: 1280,
    rotation: 0,
    flipH: false, flipV: false,
    volume: 1,
    playing: isVideo,
    loop: true,
  };

  if (isVideo) {
    const video = document.createElement('video');
    video.src = url;
    video.crossOrigin = 'anonymous';
    video.loop = true;
    // 先静音自动播放：绕过自动播放策略，保证视频画面一定能渲染出来
    video.muted = true;
    video.volume = layer.volume;
    video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
    videoElements[layerId] = video;
    video.onloadedmetadata = () => {
      const ratio = video.videoWidth / video.videoHeight;
      if (ratio > 720 / 1280) {
        layer.width = 720;
        layer.height = 720 / ratio;
        layer.y = (1280 - layer.height) / 2;
      } else {
        layer.height = 1280;
        layer.width = 1280 * ratio;
        layer.x = (720 - layer.width) / 2;
      }
      if (state.currentRoute === 'editor') render();
    };
    video.onerror = () => {
      showToast('视频文件无法解码：' + file.name + '，请换用 H.264 编码的 MP4', 'error');
      addLog('视频解码失败: ' + file.name);
    };
  } else {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const ratio = img.width / img.height;
      if (ratio > 720 / 1280) {
        layer.width = 720;
        layer.height = 720 / ratio;
        layer.y = (1280 - layer.height) / 2;
      } else {
        layer.height = 1280;
        layer.width = 1280 * ratio;
        layer.x = (720 - layer.width) / 2;
      }
      if (state.currentRoute === 'editor') render();
    };
    img.onerror = () => {
      showToast('图片文件无法解码：' + file.name, 'error');
      addLog('图片解码失败: ' + file.name);
    };
    img.src = url;
    imageElements[layerId] = img;
  }

  scene.layers.push(layer);
  scene.selectedLayerId = layerId;
  saveState();
  render();
  showToast('素材已添加: ' + layer.name, 'success');
  addLog('添加素材: ' + file.name + ' (' + (isVideo ? '视频' : '图片') + ')');
  startCanvasEngine();
}

function selectLayer(accId, layerId) {
  const scene = getScene(accId);
  scene.selectedLayerId = layerId;
  render();
}

function updateLayerProp(accId, prop, value) {
  const scene = getScene(accId);
  const layer = scene.layers.find(l => l.id === scene.selectedLayerId);
  if (!layer) return;
  layer[prop] = value;
  if (prop === 'volume' && videoElements[layer.id]) {
    videoElements[layer.id].volume = value;
  }
  saveState();
}

function moveLayer(accId, direction) {
  const scene = getScene(accId);
  const idx = scene.layers.findIndex(l => l.id === scene.selectedLayerId);
  if (idx < 0) return;
  const newIdx = idx + direction;
  if (newIdx < 0 || newIdx >= scene.layers.length) return;
  [scene.layers[idx], scene.layers[newIdx]] = [scene.layers[newIdx], scene.layers[idx]];
  saveState();
  render();
}

function deleteSelectedLayer(accId) {
  const scene = getScene(accId);
  const idx = scene.layers.findIndex(l => l.id === scene.selectedLayerId);
  if (idx < 0) { showToast('请先选择一个图层', 'error'); return; }
  const layer = scene.layers[idx];
  if (videoElements[layer.id]) {
    videoElements[layer.id].pause();
    videoElements[layer.id].src = '';
    delete videoElements[layer.id];
  }
  if (imageElements[layer.id]) {
    delete imageElements[layer.id];
  }
  scene.layers.splice(idx, 1);
  scene.selectedLayerId = scene.layers.length > 0 ? scene.layers[scene.layers.length - 1].id : null;
  saveState();
  render();
  showToast('图层已删除', 'info');
}

function toggleVideoPlay(accId, layerId) {
  const video = videoElements[layerId];
  const scene = getScene(accId);
  const layer = scene.layers.find(l => l.id === layerId);
  if (!video || !layer) return;
  if (video.paused) {
    video.play().catch(() => {});
    layer.playing = true;
  } else {
    video.pause();
    layer.playing = false;
  }
  const btn = document.getElementById('playBtn_' + layerId);
  if (btn) btn.textContent = layer.playing ? '暂停' : '播放';
}

function restartVideo(accId, layerId) {
  const video = videoElements[layerId];
  if (video) {
    video.currentTime = 0;
    video.play().catch(() => {});
  }
}

function saveScene(accId) {
  saveState();
  showToast('场景已保存', 'success');
  addLog('画面场景已保存');
}

function applyToOutput(accId) {
  const outCanvas = document.querySelector('#outputCanvas_' + accId + ' canvas');
  if (outCanvas) {
    const emptyEl = document.getElementById('outputEmpty_' + accId);
    if (emptyEl) emptyEl.style.display = 'none';
  }
  showToast('已应用到输出', 'success');
  addLog('画面已应用到输出通道');
}

function setMasterVolume(accId, vol) {
  const scene = getScene(accId);
  scene.outputVolume = vol;
  scene.layers.forEach(l => {
    if (videoElements[l.id]) {
      videoElements[l.id].volume = l.volume * vol;
    }
  });
  saveState();
}

// v1.15.11 滤镜功能已整体下掉（推流加滤镜导致直播间无画面，WebGL 预览黑屏）——全部还原 v1.15.9 之前，无滤镜

function startCanvasEngine() {
  if (canvasRenderRunning) return;
  canvasRenderRunning = true;
  lastFrameTime = performance.now();
  requestAnimationFrame(canvasRenderLoop);
}

function canvasRenderLoop(timestamp) {
  if (!canvasRenderRunning) return;

  // FPS计算
  frameCount++;
  if (timestamp - fpsLastUpdate >= 1000) {
    const fps = Math.round(frameCount * 1000 / (timestamp - fpsLastUpdate) * 10) / 10;
    document.querySelectorAll('[id^="fps_"]').forEach(el => {
      el.textContent = fps + ' FPS';
    });
    frameCount = 0;
    fpsLastUpdate = timestamp;
  }

  // 渲染所有可见的编辑器canvas
  if (state.currentRoute === 'editor' && state.editingAccountId) {
    const accId = state.editingAccountId;
    const scene = getScene(accId);

    // 预览画布
    const previewCanvas = document.querySelector('#previewCanvas_' + accId + ' canvas');
    if (previewCanvas) {
      renderSceneToCanvas(previewCanvas, scene, accId, true);
    }
    // 输出画布
    const outCanvas = document.querySelector('#outputCanvas_' + accId + ' canvas');
    if (outCanvas) {
      renderSceneToCanvas(outCanvas, scene, accId, false);
    }
  }

  // 渲染所有推流中房间的离屏输出画布（无论当前在哪个页面，推流画面始终是画面编辑内容）
  state.accounts.forEach(a => {
    if (a.streaming) {
      renderSceneToCanvas(getOffscreenCanvas(a.id), getScene(a.id), a.id, false);
    }
  });

  lastFrameTime = timestamp;
  requestAnimationFrame(canvasRenderLoop);
}

// v1.15.11 滤镜已下掉：预览直接渲染场景（无任何后处理，杜绝黑屏）
function renderSceneToCanvas(canvas, scene, accId, showSelection) {
  renderSceneInner(canvas, scene, accId, showSelection);
}

function renderSceneInner(canvas, scene, accId, showSelection) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // 清空
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, W, H);

  // 绘制网格背景
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // 按层级绘制图层
  scene.layers.forEach(layer => {
    ctx.save();

    // 变换中心
    const cx = layer.x + layer.width / 2;
    const cy = layer.y + layer.height / 2;
    ctx.translate(cx, cy);
    if (layer.rotation) ctx.rotate(layer.rotation * Math.PI / 180);
    ctx.scale(layer.flipH ? -1 : 1, layer.flipV ? -1 : 1);
    ctx.translate(-layer.width / 2, -layer.height / 2);

    // 绘制内容
    if (layer.type === 'video' && videoElements[layer.id]) {
      const video = videoElements[layer.id];
      if (video.readyState >= 2) {
        ctx.drawImage(video, 0, 0, layer.width, layer.height);
      }
    } else if (layer.type === 'image' && imageElements[layer.id] && imageElements[layer.id].complete) {
      ctx.drawImage(imageElements[layer.id], 0, 0, layer.width, layer.height);
    } else {
      // 占位
      ctx.fillStyle = 'rgba(99,102,241,0.2)';
      ctx.fillRect(0, 0, layer.width, layer.height);
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(layer.name, layer.width / 2, layer.height / 2);
    }

    ctx.restore();

    // 选中框
    if (showSelection && layer.id === scene.selectedLayerId) {
      ctx.save();
      ctx.strokeStyle = '#6366f1';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.strokeRect(layer.x, layer.y, layer.width, layer.height);
      ctx.setLineDash([]);
      // 角点 + 边中点（v1.15.30 8 个缩放手柄：角点自由缩放、边中点单方向拉伸 = 随意拉大拉小/拉长拉短）
      const handles = [
        [layer.x, layer.y], [layer.x + layer.width, layer.y],
        [layer.x, layer.y + layer.height], [layer.x + layer.width, layer.y + layer.height],
        [layer.x + layer.width / 2, layer.y], [layer.x + layer.width / 2, layer.y + layer.height],
        [layer.x, layer.y + layer.height / 2], [layer.x + layer.width, layer.y + layer.height / 2],
      ];
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#6366f1';
      ctx.lineWidth = 2;
      handles.forEach(([hx, hy]) => {
        ctx.fillRect(hx - 5, hy - 5, 10, 10);
        ctx.strokeRect(hx - 5, hy - 5, 10, 10);
      });
      ctx.restore();
    }
  });
}

// 画布拖拽交互
let dragState = null;
function setupCanvasDrag() {
  document.addEventListener('mousedown', (e) => {
    if (state.currentRoute !== 'editor') return;
    const previewDiv = e.target.closest('.canvas-preview');
    if (!previewDiv || !previewDiv.id.startsWith('previewCanvas_')) return;
    const accId = state.editingAccountId;
    const scene = getScene(accId);
    const canvas = previewDiv.querySelector('canvas');
    if (!canvas) return;

    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;

    // v1.15.30 缩放手柄检测（选中图层 8 个手柄：角点 nw/ne/sw/se + 边中点 n/s/w/e）：命中 → 进入缩放拖拽
    const selLayer = scene.layers.find(l => l.id === scene.selectedLayerId);
    if (selLayer) {
      const hw = 7;
      const hps = [
        [selLayer.x, selLayer.y, 'nw'], [selLayer.x + selLayer.width, selLayer.y, 'ne'],
        [selLayer.x, selLayer.y + selLayer.height, 'sw'], [selLayer.x + selLayer.width, selLayer.y + selLayer.height, 'se'],
        [selLayer.x + selLayer.width / 2, selLayer.y, 'n'], [selLayer.x + selLayer.width / 2, selLayer.y + selLayer.height, 's'],
        [selLayer.x, selLayer.y + selLayer.height / 2, 'w'], [selLayer.x + selLayer.width, selLayer.y + selLayer.height / 2, 'e'],
      ];
      for (const [hx, hy, dir] of hps) {
        if (Math.abs(mx - hx) <= hw && Math.abs(my - hy) <= hw) {
          dragState = { mode: 'resize', layerId: selLayer.id, dir, startX: mx, startY: my, origX: selLayer.x, origY: selLayer.y, origW: selLayer.width, origH: selLayer.height };
          break;
        }
      }
    }
    if (dragState) { render(); e.preventDefault(); return; }

    // 检查点击了哪个图层（从上层到下层）
    let clickedLayer = null;
    for (let i = scene.layers.length - 1; i >= 0; i--) {
      const l = scene.layers[i];
      if (mx >= l.x && mx <= l.x + l.width && my >= l.y && my <= l.y + l.height) {
        clickedLayer = l;
        break;
      }
    }

    if (clickedLayer) {
      scene.selectedLayerId = clickedLayer.id;
      dragState = {
        mode: 'move',
        layerId: clickedLayer.id,
        startX: mx,
        startY: my,
        origX: clickedLayer.x,
        origY: clickedLayer.y,
      };
      render();
      e.preventDefault();
    }
  });

  document.addEventListener('mousemove', (e) => {
    if (!dragState || state.currentRoute !== 'editor') return;
    const accId = state.editingAccountId;
    const scene = getScene(accId);
    const layer = scene.layers.find(l => l.id === dragState.layerId);
    if (!layer) return;

    const previewDiv = document.getElementById('previewCanvas_' + accId);
    if (!previewDiv) return;
    const canvas = previewDiv.querySelector('canvas');
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;

    // v1.15.30 缩放手柄拖拽：角点自由缩放（宽高同时）、边中点单方向拉伸（拉长拉短）
    if (dragState.mode === 'resize') {
      const dx = mx - dragState.startX;
      const dy = my - dragState.startY;
      if (dragState.dir.includes('e')) layer.width = Math.max(10, dragState.origW + dx);
      if (dragState.dir.includes('s')) layer.height = Math.max(10, dragState.origH + dy);
      if (dragState.dir.includes('w')) { layer.width = Math.max(10, dragState.origW - dx); layer.x = dragState.origX + dx; }
      if (dragState.dir.includes('n')) { layer.height = Math.max(10, dragState.origH - dy); layer.y = dragState.origY + dy; }
      return;
    }
    layer.x = dragState.origX + (mx - dragState.startX);
    layer.y = dragState.origY + (my - dragState.startY);
  });

  document.addEventListener('mouseup', () => {
    if (dragState) {
      dragState = null;
      saveState();
    }
  });
}

// ============================================================
// 初始化
// ============================================================
function init() {
  // 版本号同步显示（软件内部版本号与安装包版本一致，来自 package.json）
  if (isElectron && window.tkAPI && window.tkAPI.getVersion) {
    window.tkAPI.getVersion().then(v => {
      const tag = document.getElementById('appVersionTag');
      if (tag) tag.textContent = 'v' + v + ' · 手机直播 · 全自动推流';
      if (v) document.title = 'TikTok直播工作台 v' + v + ' - 多房间独立直播工作台';
    }).catch(() => {});
  }

  // v1.6.2 桌面拖拽：把电脑里的视频/图片直接拖进画面编辑区（canvas 区域）添加为素材
  document.addEventListener('dragover', (e) => {
    if (e.target && e.target.closest && e.target.closest('.canvas-area')) {
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
    }
  });
  document.addEventListener('drop', (e) => {
    const zone = e.target && e.target.closest ? e.target.closest('.canvas-area') : null;
    if (!zone) return;
    e.preventDefault();
    const files = e.dataTransfer && e.dataTransfer.files;
    if (!files || files.length === 0) return;
    const accId = state.editingAccountId;
    if (!accId) { showToast('请先进入某个房间的画面编辑页再拖入素材', 'warning'); return; }
    const okExt = /\.(mp4|mov|avi|mkv|webm|jpg|jpeg|png|gif|webp)$/i;
    let added = 0;
    for (const f of files) {
      if (/^(video|image)\//.test(f.type) || okExt.test(f.name)) {
        handleLayerFileUpload(accId, f);
        added++;
      }
    }
    if (added > 0) {
      showToast('已从桌面拖入 ' + added + ' 个素材到画面编辑', 'success');
      addLog('桌面拖拽添加素材: ' + added + ' 个 → 房间' + accId);
    } else {
      showToast('拖入的文件不是视频/图片格式', 'warning');
    }
  });

  // restore broadcast state
  document.getElementById('broadcastText').textContent = '播报:' + (state.broadcast ? '开' : '关');
  document.getElementById('broadcastDot').style.background = state.broadcast ? 'var(--success)' : 'var(--text-tertiary)';

  // 全局监听：推流码自动回填（任意房间）
  if (isElectron && window.tkAPI && !window._streamKeyListenerBound) {
    window.tkAPI.onStreamKeyFound(({ accountId, rtmpUrl, streamKey }) => {
      const a = state.accounts.find(x => String(x.id) === String(accountId));
      if (a) {
        a.status = 'connected';
        if (streamKey) a.streamKey = streamKey;
        if (rtmpUrl) a.rtmpUrl = rtmpUrl;
        saveState();
        if (state.currentRoute === 'mobile') render();
        showToast('已自动获取推流码', 'success');
        addLog((a.roomName || ('房间 ' + a.id)) + (a.name ? ' @' + a.name : '') + ' 推流码已自动获取');
      }
    });
    window._streamKeyListenerBound = true;
  }

  // 全局监听：运行进度（登录/推流码流程百分比 → 日志区）
  if (isElectron && window.tkAPI && !window._progressListenerBound) {
    window.tkAPI.onProgress((data) => updateProgress(data));
    window._progressListenerBound = true;
  }

  // v1.15.4 全局监听：手机下播 → 清空界面推流码显示（主进程已清存储，界面同步刷新）
  if (isElectron && window.tkAPI && window.tkAPI.onStreamCleared && !window._streamClearedBound) {
    window.tkAPI.onStreamCleared((data) => {
      const acc = state.accounts.find(a => String(a.id) === String(data.accountId));
      if (acc) {
        acc.rtmpUrl = ''; acc.streamKey = ''; acc.streaming = false; acc.status = 'connected';
        saveState();
        if (state.currentRoute === 'mobile') render();
        try { addLog((acc.roomName || ('房间 ' + acc.id)) + ' 推流码已清空（手机下播）'); } catch (e) {}
      }
    });
    window._streamClearedBound = true;
  }

  // v1.8.0 全局监听：实时互动事件 / 风险告警 / 监控状态
  if (isElectron && window.tkAPI && !window._imListenerBound) {
    window.tkAPI.onImEvents((data) => handleImEvents(data));
    window.tkAPI.onRiskWarning((data) => handleRiskWarning(data));
    window.tkAPI.onMonitorState((data) => handleMonitorState(data));
    window.tkAPI.onMonitorCleared((data) => handleMonitorCleared(data));
    window.tkAPI.onMonitorFrame((data) => handleMonitorFrame(data));
    // v1.12.43 手机下播提醒（醒目横幅 + 蜂鸣 + 确认）
    window.tkAPI.onPhoneDownRemind((data) => handlePhoneDownRemind(data));
    window._imListenerBound = true;
    // v1.9.0 启动时恢复各房间监控：前端标记运行但主进程没跑（应用重启）→ 自动重新启动
    state.accounts.forEach(a => {
      if (!a.monitorRunning) return;
      if (window.tkAPI.monitorStatus) {
        window.tkAPI.monitorStatus({ accountId: a.id }).then(r => {
          if (r && r.running) {
            a.monitorRunning = true;
            saveState();
            render();
            addLog('房间' + a.id + ' 监控状态已恢复（运行中）');
          } else {
            addLog('房间' + a.id + ' 检测到上次监控未恢复，正在自动重启监控...');
            window.tkAPI.startMonitor({ accountId: a.id, accountName: a.name }).then(r2 => {
              if (r2 && r2.success) {
                a.monitorRunning = true;
                saveState(); render();
                if (window.tkAPI.monitorFocusUI) window.tkAPI.monitorFocusUI({ accountId: a.id });
                addLog('房间' + a.id + ' 监控已自动恢复' + (r2.roomId ? '，直播间 ' + r2.roomId : '') + '（独立监控窗口已弹出）');
              } else {
                a.monitorRunning = false;
                saveState(); render();
                addLog('房间' + a.id + ' 监控自动恢复失败: ' + (r2 && r2.error ? r2.error : '未知错误'));
              }
            });
          }
        });
      }
    });
  }

  // v1.10.0 独立监控窗口模式（可拖出软件页面外）：index.html?monitor=1&accountId=X
  const mp = new URLSearchParams(location.search || '');
  if (mp.get('monitor') === '1') {
    initMonitorMode(parseInt(mp.get('accountId') || '0', 10));
    return;
  }

  // restore route
  if (state.currentRoute === 'editor' && !state.editingAccountId) {
    state.currentRoute = 'mobile';
  }
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.route === state.currentRoute);
  });

  render();
  setupCanvasDrag();
  startCanvasEngine();
  startLiveTicker();
  addLog('系统就绪，共 ' + state.accounts.length + ' 个房间，' + state.nodes.length + ' 个节点');
}

init();
</script>
