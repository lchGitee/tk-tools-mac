<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok直播工作台 - 多房间独立直播工作台</title>
<!-- v1.14.7 字体内置化：移除飞书 CDN 外部字体（离线/新电脑加载失败），改用 Windows/macOS 系统字体栈 -->
<style>
/* ===== 设计变量 ===== */
:root {
  --bg: #f4f5f9;
  --surface: #ffffff;
  --surface-hover: #f8f9fc;
  --border: #e5e7ef;
  --border-light: #eef0f6;
  --text-primary: #1e2030;
  --text-secondary: #6b7085;
  --text-tertiary: #9ca1b5;
  --primary: #6366f1;
  --primary-hover: #5558e3;
  --primary-light: #eef0ff;
  --primary-dark: #4f46e5;
  --success: #10b981;
  --success-light: #ecfdf5;
  --warning: #f59e0b;
  --warning-light: #fffbeb;
  --danger: #ef4444;
  --danger-light: #fef2f2;
  --info: #3b82f6;
  --topbar-bg: #16182d;
  --topbar-text: #e4e6f0;
  --sidebar-bg: #fafbfe;
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow-sm: 0 1px 2px rgba(22,24,45,0.04);
  --shadow: 0 2px 8px rgba(22,24,45,0.06);
  --shadow-lg: 0 8px 30px rgba(22,24,45,0.12);
  --font: 'Microsoft YaHei', 'PingFang SC', 'Segoe UI', -apple-system, sans-serif;
  --mono: 'Consolas', 'JetBrains Mono', 'Courier New', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  min-width: 1200px;
  overflow-x: auto;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; font-size: 14px; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d1d5e0; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #b0b5c5; }

/* ===== 顶栏 ===== */
.topbar {
  height: 60px;
  background: var(--topbar-bg);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo-wrap { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, #25F4EE 0%, #FE2C55 100%);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 18px; color: #fff;
  letter-spacing: -1px;
}
.logo-text { display: flex; flex-direction: column; }
.logo-title { color: #fff; font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
.logo-sub { color: var(--text-tertiary); font-size: 11px; margin-top: 1px; }
.topbar-spacer { flex: 1; }
.topbar-btn {
  height: 36px; padding: 0 16px;
  border-radius: 8px;
  color: var(--topbar-text);
  font-size: 13px; font-weight: 500;
  display: flex; align-items: center; gap: 6px;
  transition: all 0.15s;
  border: 1px solid rgba(255,255,255,0.1);
}
.topbar-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }
.topbar-btn.primary {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.topbar-btn.primary:hover { background: var(--primary-hover); }
.topbar-btn .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--success);
}

/* ===== 主布局 ===== */
.layout { display: flex; min-height: calc(100vh - 60px); }
.sidebar {
  width: 220px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border-light);
  padding: 16px 0;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 20px;
  color: var(--text-secondary);
  font-size: 14px; font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  border-left: 3px solid transparent;
  position: relative;
}
.nav-item:hover { background: var(--surface-hover); color: var(--text-primary); }
.nav-item.active {
  background: var(--primary-light);
  color: var(--primary-dark);
  border-left-color: var(--primary);
  font-weight: 600;
}
.nav-item .badge {
  margin-left: auto;
  background: var(--primary);
  color: #fff;
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 10px;
  font-weight: 600;
}
.nav-item .icon { width: 18px; height: 18px; flex-shrink: 0; }

.sidebar-divider { height: 1px; background: var(--border-light); margin: 12px 16px; }

.overview-panel { padding: 0 16px; flex: 1; }
.overview-title {
  font-size: 12px; font-weight: 600;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.overview-title .link { color: var(--primary); cursor: pointer; font-size: 11px; text-transform: none; }
.overview-card {
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
}
.overview-row {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 6px 0;
}
.overview-row + .overview-row { border-top: 1px solid var(--border-light); }
.overview-label { font-size: 12px; color: var(--text-secondary); }
.overview-value { font-size: 18px; font-weight: 700; color: var(--text-primary); }
.overview-value .unit { font-size: 12px; font-weight: 400; color: var(--text-tertiary); margin-left: 2px; }
.overview-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
.overview-alert {
  background: var(--warning-light);
  border: 1px solid #fde68a;
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-top: 10px;
  font-size: 12px;
  color: #92400e;
  line-height: 1.6;
}
.overview-alert .dot {
  display: inline-block; width: 8px; height: 8px;
  background: var(--warning); border-radius: 50%;
  margin-right: 6px;
}

/* ===== 主内容区 ===== */
.main { flex: 1; padding: 20px 24px; min-width: 0; }
.page-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 18px;
}
.page-title { font-size: 22px; font-weight: 700; color: var(--text-primary); }
.page-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

/* ===== 账号卡片 ===== */
.account-grid { display: flex; flex-direction: column; gap: 12px; }
/* v1.10.0 卡片紧凑化：缩小间距与内边距，美观简约 */
.account-card {
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s;
}
.account-card:hover { box-shadow: var(--shadow); }

.metrics-bar {
  display: flex;
  padding: 10px 18px 8px;
  gap: 10px;
  border-bottom: 1px solid var(--border-light);
}
.metric {
  flex: 1;
  text-align: center;
  position: relative;
}
.metric + .metric::before {
  content: '';
  position: absolute;
  left: 0; top: 10%; bottom: 10%;
  width: 1px; background: var(--border-light);
}
.metric-value {
  font-size: 26px; font-weight: 700;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}
.metric-label {
  font-size: 12px; color: var(--text-secondary);
  margin-top: 4px;
}

.card-actions-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border-light);
  flex-wrap: wrap;
}
.status-indicator {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 500;
  color: var(--text-secondary);
  margin-right: auto;
}
.status-dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--text-tertiary);
  flex-shrink: 0;
}
.status-dot.live { background: var(--danger); animation: pulse 1.5s infinite; }
.status-dot.connected { background: var(--success); }
.status-dot.warning { background: var(--warning); }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.account-input {
  width: 200px;
  height: 38px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s;
  background: var(--surface);
}
.account-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }

.btn {
  height: 38px; padding: 0 18px;
  border-radius: 8px;
  font-size: 13px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-secondary {
  background: #eef0f9;
  color: #45496b;
  border: 1px solid #c9cdE6;
  box-shadow: 0 1px 2px rgba(15,23,42,0.05);
}
.btn-secondary:hover { background: #e4e7f6; border-color: #a9aed6; }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #059669; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #dc2626; }
.btn-ghost {
  background: #f6f7fb;
  color: #565b78;
  border: 1px solid #d6d9e7;
  box-shadow: 0 1px 2px rgba(15,23,42,0.04);
}
.btn-ghost:hover { background: #eceef8; border-color: #b4b8da; color: #333750; }
.btn-sm { height: 30px; padding: 0 12px; font-size: 12px; border-radius: 6px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.status-tag {
  font-size: 12px; font-weight: 500;
  padding: 4px 10px; border-radius: 6px;
  background: var(--surface-hover);
  color: var(--text-secondary);
}
.status-tag.live { background: var(--danger-light); color: var(--danger); }
.status-tag.success { background: var(--success-light); color: var(--success); }
.status-tag.warning { background: var(--warning-light); color: #b45309; }

/* v1.13.0 界面优化：操作按钮分组排版，主次分明 */
.actions-row {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  width: 100%;
}
.actions-row + .actions-row { margin-top: 10px; }
/* v1.13.6 第二行工具区：组标签/按钮/素材标签/签名徽章统一高度与间距，对齐简约（对标成品控制台） */
.actions-row-tools { flex-wrap: wrap; gap: 8px; }
.actions-row-tools .action-group-label {
  margin: 0 4px 0 14px; line-height: 34px; white-space: nowrap;
}
.actions-row-tools .action-group-label:first-child { margin-left: 0; }
.actions-row-tools .btn {
  height: 34px; padding: 0 14px; font-size: 12.5px; border-radius: 8px;
  line-height: 1; white-space: nowrap;
}
.actions-row-tools .push-video-tag,
.actions-row-tools .signer-badge {
  height: 34px; line-height: 34px; padding: 0 12px;
  font-size: 11.5px; border-radius: 8px;
  white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis;
}
.action-group-label {
  font-size: 11px; color: var(--text-tertiary);
  font-weight: 700; letter-spacing: 0.8px;
  margin: 0 4px 0 12px; user-select: none;
}
.action-group-label:first-child { margin-left: 0; }
.btn-main {
  height: 42px; padding: 0 24px;
  font-size: 14px; font-weight: 700; border-radius: 10px;
  box-shadow: 0 2px 10px rgba(99,102,241,0.28);
}
.btn-main.btn-success { box-shadow: 0 2px 10px rgba(16,185,129,0.28); }
.btn-main.btn-danger { box-shadow: 0 2px 10px rgba(239,68,68,0.28); }
.btn-danger-text { color: var(--danger); }
.btn-danger-text:hover { background: var(--danger-light); color: var(--danger); }
.engine-select {
  height: 38px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--text-primary);
  font-size: 12.5px; font-weight: 600; padding: 0 8px; outline: none;
  cursor: pointer;
}
.engine-select:focus { border-color: var(--primary); }
/* 第一行动作行：主按钮区与状态右对齐 */
.actions-row-main { align-items: center; }
.actions-row-main .status-indicator { margin-right: 0; }
.push-video-tag {
  font-size: 12px; font-weight: 500; color: var(--text-secondary);
  background: #f6f7fb; padding: 3px 8px; border-radius: 6px;
  border: 1px solid #d6d9e7;
  max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.signer-badge {
  font-size: 11px; font-weight: 500; color: var(--text-secondary);
  background: #f6f7fb; padding: 3px 8px; border-radius: 6px;
  border: 1px solid #d6d9e7;
}

/* 日志区进度条 */
.log-progress {
  display: inline-flex; align-items: center; gap: 6px;
  margin-right: 12px; font-size: 12px; color: var(--success);
  font-family: var(--mono); white-space: nowrap;
}
.pbar {
  width: 90px; height: 6px; border-radius: 3px;
  background: rgba(255,255,255,0.1); overflow: hidden; display: inline-block;
}
.pbar i {
  display: block; height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--success), #67e8f9);
  border-radius: 3px; transition: width 0.4s ease;
}

.room-badge {
  font-size: 11px; font-weight: 600;
  padding: 3px 8px; border-radius: 20px;
  background: rgba(99,102,241,0.12);
  color: var(--primary);
  margin-left: 6px;
}

/* ===== 推流信息 ===== */
.stream-info {
  margin: 0 24px 14px;
  padding: 14px 18px;
  background: var(--success-light);
  border: 1px solid #a7f3d0;
  border-radius: var(--radius);
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 16px;
}
.stream-info-text { flex: 1; min-width: 0; }
.stream-info-title {
  font-size: 13px; font-weight: 600;
  color: #065f46;
  margin-bottom: 4px;
}
.stream-info-meta {
  font-size: 12px; color: #047857;
  font-family: var(--mono);
  word-break: break-all;
  line-height: 1.6;
}
.stream-info-actions { display: flex; gap: 8px; flex-shrink: 0; }

/* ===== 实时动态 ===== */
.feed-section { padding: 0 24px 18px; }
.feed-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px;
}
.feed-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.feed-actions { display: flex; gap: 8px; }
.feed-box {
  background: var(--bg);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  height: 200px;
  overflow-y: auto;
  padding: 12px 16px;
}
.feed-empty {
  height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--text-tertiary);
  gap: 6px;
}
.feed-empty .main { font-size: 15px; font-weight: 500; }
.feed-empty .sub { font-size: 12px; }
.feed-item {
  padding: 6px 0;
  font-size: 13px;
  display: flex; gap: 8px;
  align-items: flex-start;
  animation: fadeIn 0.3s;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.feed-type {
  flex-shrink: 0;
  font-size: 11px; font-weight: 600;
  padding: 1px 6px; border-radius: 4px;
  margin-top: 2px;
}
.feed-type.comment { background: #e0e7ff; color: #4338ca; }
.feed-type.enter { background: #dbeafe; color: #1d4ed8; }
.feed-type.gift { background: #fce7f3; color: #be185d; }
.feed-type.like { background: #fee2e2; color: #b91c1c; }
.feed-type.follow { background: #d1fae5; color: #047857; }
.feed-type.system { background: #f3f4f6; color: #4b5563; }
.feed-type.risk { background: #fef3c7; color: #b45309; }
.feed-type.online { background: #e0f2fe; color: #0369a1; }
.btn-live { background: var(--success); color: #fff !important; border-color: var(--success) !important; }
.feed-content { flex: 1; min-width: 0; }
.feed-user { font-weight: 600; color: var(--primary-dark); }
.feed-text { color: var(--text-primary); }
.feed-translate {
  font-size: 12px; color: var(--text-secondary);
  margin-top: 2px;
}

/* ===== 自动互动设置 ===== */
.auto-interact {
  padding: 12px 24px;
  border-top: 1px solid var(--border-light);
  background: #fafbff;
}
.interact-row {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.checkbox-wrap {
  display: flex; align-items: center; gap: 8px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-primary);
}
.checkbox-wrap input[type="checkbox"] {
  width: 16px; height: 16px;
  accent-color: var(--primary);
  cursor: pointer;
}
.select {
  height: 34px; padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  background: var(--surface);
  outline: none;
  cursor: pointer;
}
.select:focus { border-color: var(--primary); }
.textarea {
  width: 100%;
  min-height: 60px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  resize: vertical;
  outline: none;
  font-family: inherit;
  line-height: 1.6;
}
.textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
.hint-text { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; line-height: 1.5; }

/* ===== 节点管理页 ===== */
.node-list { display: flex; flex-direction: column; gap: 12px; }
.node-card {
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 18px 22px;
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 20px;
}
.node-info { flex: 1; }
.node-name { font-size: 16px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
.node-meta { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
.node-status {
  font-size: 13px; font-weight: 500;
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 6px;
}
.node-status.success { color: var(--success); }
.node-status.error { color: var(--danger); }
.node-ip { font-size: 12px; color: var(--text-secondary); font-family: var(--mono); margin-bottom: 4px; }
.node-speed {
  display: flex; gap: 20px;
  font-size: 12px; color: var(--text-secondary);
}
.node-speed span strong { color: var(--text-primary); font-weight: 600; }
.node-actions { display: flex; gap: 8px; flex-shrink: 0; }

.add-node-form {
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 20px;
}
.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 13px; font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
}
.form-input {
  width: 100%;
  height: 42px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  transition: all 0.15s;
}
.form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
.form-input::placeholder { color: var(--text-tertiary); }
.form-desc {
  font-size: 12px; color: var(--text-secondary);
  margin-top: 6px; line-height: 1.6;
}
.form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

/* ===== 节点分配 ===== */
.assign-list {
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.assign-row {
  display: flex; align-items: center; gap: 16px;
  padding: 16px 22px;
  border-bottom: 1px solid var(--border-light);
}
.assign-row:last-child { border-bottom: none; }
.assign-account { flex: 1; min-width: 0; }
.assign-account .idx { font-size: 11px; color: var(--text-tertiary); margin-bottom: 2px; }
.assign-account .name { font-size: 15px; font-weight: 600; color: var(--text-primary); }
.assign-select { width: 240px; }

/* ===== 画面编辑器 ===== */
.editor-layout { display: flex; height: calc(100vh - 100px); gap: 0; }
.editor-left {
  width: 180px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border-light);
  padding: 12px 0;
  flex-shrink: 0;
}
.editor-room-item {
  padding: 10px 16px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: all 0.15s;
}
.editor-room-item.active {
  background: var(--primary-light);
  border-left-color: var(--primary);
}
.editor-room-item .rname { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.editor-room-item .rstatus { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }

.editor-center { flex: 1; padding: 20px; overflow-y: auto; min-width: 0; }
.editor-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px;
}
.editor-title { font-size: 20px; font-weight: 700; }
.editor-meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; font-family: var(--mono); }

.stream-panel {
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 16px;
}
.stream-panel-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px;
}
.stream-tabs { display: flex; gap: 16px; }
.stream-tab {
  font-size: 14px; font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  padding-bottom: 4px;
  border-bottom: 2px solid transparent;
}
.stream-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.stream-stats {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.stream-stat .label { font-size: 11px; color: var(--text-tertiary); margin-bottom: 2px; }
.stream-stat .value { font-size: 14px; font-weight: 600; color: var(--text-primary); font-family: var(--mono); }
.stream-stat .value.error { color: var(--danger); }

.canvas-area {
  display: flex; gap: 32px; justify-content: center;
  align-items: flex-start;
  padding: 16px 0;
}
.canvas-frame {
  display: flex; flex-direction: column; align-items: center;
  gap: 8px;
}
.canvas-preview {
  width: 300px; height: 533px;
  background: #0f0f1a;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  box-shadow: var(--shadow-lg);
  cursor: crosshair;
}
.canvas-preview canvas {
  width: 100%; height: 100%;
  display: block;
}
.canvas-preview .placeholder-text {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: rgba(255,255,255,0.5);
  font-size: 13px;
  text-align: center;
  padding: 20px;
  gap: 10px;
  pointer-events: none;
}
.canvas-preview .placeholder-text .big {
  font-size: 32px; opacity: 0.4;
}
.canvas-preview .upload-hint {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  background: rgba(99,102,241,0.9); color: #fff;
  padding: 6px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 600;
  cursor: pointer; pointer-events: auto;
  white-space: nowrap;
}
.canvas-preview .upload-hint:hover { background: var(--primary); }
.canvas-label { font-size: 11px; color: var(--text-tertiary); font-weight: 500; }
.canvas-label .fps { color: var(--success); font-family: var(--mono); }

/* 图层选中框 */
.layer-select-box {
  position: absolute;
  border: 2px dashed var(--primary);
  pointer-events: none;
  box-sizing: border-box;
}
.layer-handle {
  position: absolute;
  width: 10px; height: 10px;
  background: #fff;
  border: 2px solid var(--primary);
  border-radius: 2px;
  pointer-events: auto;
  cursor: nwse-resize;
}

.editor-right {
  width: 320px;
  background: var(--sidebar-bg);
  border-left: 1px solid var(--border-light);
  padding: 16px;
  overflow-y: auto;
  flex-shrink: 0;
}
.panel-box {
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}
.panel-title {
  font-size: 13px; font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 10px;
  display: flex; justify-content: space-between; align-items: center;
}
.layer-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  border-radius: 6px;
  cursor: pointer;
  margin-bottom: 4px;
  transition: background 0.15s;
}
.layer-item:hover { background: var(--surface-hover); }
.layer-item.active { background: var(--primary-light); }
.layer-item .lname { flex: 1; font-size: 13px; font-weight: 500; }
.layer-item .licon { width: 16px; height: 16px; color: var(--text-secondary); }

.prop-row {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; margin-bottom: 8px;
}
.prop-row.full { grid-template-columns: 1fr; }
.prop-label { font-size: 11px; color: var(--text-tertiary); margin-bottom: 3px; }
.prop-input {
  width: 100%; height: 32px;
  padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  outline: none;
  font-family: var(--mono);
}
.prop-input:focus { border-color: var(--primary); }

.volume-slider {
  width: 100%;
  accent-color: var(--success);
  height: 4px;
}

/* ===== 弹窗 ===== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(22,24,45,0.5);
  backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
  animation: fadeIn 0.2s;
}
.modal {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 480px;
  max-width: 90vw;
  max-height: 85vh;
  overflow-y: auto;
  animation: slideUp 0.25s;
}
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.modal-header {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border-light);
  display: flex; justify-content: space-between; align-items: flex-start;
}
.modal-title { font-size: 18px; font-weight: 700; }
.modal-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
.modal-close {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-tertiary);
  font-size: 20px;
  transition: all 0.15s;
}
.modal-close:hover { background: var(--surface-hover); color: var(--text-primary); }
.modal-body { padding: 20px 24px; }
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border-light);
  display: flex; justify-content: flex-end; gap: 10px;
}

/* 实时监控弹窗 */
.monitor-modal { width: 560px; }
.monitor-metrics {
  display: flex;
  padding: 16px 0;
  border-bottom: 1px solid var(--border-light);
  margin-bottom: 16px;
}
.monitor-metric { flex: 1; text-align: center; position: relative; }
.monitor-metric + .monitor-metric::before {
  content: ''; position: absolute; left: 0; top: 5%; bottom: 5%;
  width: 1px; background: var(--border-light);
}
.monitor-metric .v { font-size: 24px; font-weight: 700; }
.monitor-metric .l { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

.monitor-stream {
  background: var(--success-light);
  border: 1px solid #a7f3d0;
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 16px;
}
.monitor-stream .title { font-size: 13px; font-weight: 600; color: #065f46; margin-bottom: 6px; }
.monitor-stream .code {
  font-size: 11px; color: #047857;
  font-family: var(--mono);
  word-break: break-all; line-height: 1.6;
}

/* v1.9.1 每房间独立监控弹窗（白底黑字，浅色主题） */
.mon-panel {
  position: fixed; width: 400px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 12px 40px rgba(22, 24, 45, 0.18);
  z-index: 300;
  display: flex; flex-direction: column;
  overflow: hidden;
  color: var(--text-primary);
}
.mon-panel.minimized .mon-panel-body { display: none; }
.mon-panel-header {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px;
  background: var(--surface-hover);
  border-bottom: 1px solid var(--border-light);
  cursor: move; user-select: none;
}
.mon-panel-title { font-size: 13px; font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); }
.mon-panel-title .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--text-tertiary); }
.mon-panel-title .dot.live { background: #10b981; box-shadow: 0 0 6px #10b98188; }
.mon-panel-live { font-size: 11px; color: var(--text-secondary); font-weight: 600; margin-right: 2px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.mon-panel-icon {
  width: 24px; height: 24px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-tertiary); font-size: 14px;
}
.mon-panel-icon:hover { background: #e8eaf1; color: var(--text-primary); }
.mon-panel-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
/* v1.10.0 直播画面小电视（监控窗口直播画面，非网页） */
.mon-panel-tv {
  width: 100%; aspect-ratio: 9 / 16; max-height: 300px;
  background: #0a0a0f; border-radius: 10px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border-light);
}
.mon-panel-tv img { width: 100%; height: 100%; object-fit: contain; }
.mon-panel-tv .tv-placeholder { color: #8a8a95; font-size: 12px; text-align: center; }
/* v1.10.0 独立监控窗口（可拖出软件页面外）：全屏面板 + frameless 拖动 */
body.monitor-mode { margin: 0; padding: 0; overflow: hidden; background: #eef0f5; }
body.monitor-mode .mon-panel.mon-standalone {
  position: fixed; inset: 0; width: 100vw; height: 100vh;
  display: flex; flex-direction: column; border-radius: 0; box-shadow: none; border: none;
}
body.monitor-mode .mon-panel-body { flex: 1; overflow-y: auto; }
body.monitor-mode .mon-panel-header { -webkit-app-region: drag; cursor: move; }
body.monitor-mode .mon-panel-icon { -webkit-app-region: no-drag; }
body.monitor-mode .mon-panel-tv { max-height: 42vh; aspect-ratio: 9/16; }
.mon-panel-metrics { display: flex; }
.mon-panel-metrics .monitor-metric + .monitor-metric::before { top: 10%; bottom: 10%; }
.mon-panel-metrics .monitor-metric .v { font-size: 19px; font-weight: 700; color: var(--text-primary); }
.mon-panel-metrics .monitor-metric .l { color: var(--text-secondary); }
.mon-panel-feed {
  height: 190px; overflow-y: auto;
  background: #f5f6fa;
  border: 1px solid var(--border-light);
  border-radius: 8px; padding: 8px;
  display: flex; flex-direction: column; gap: 4px;
}
.mon-panel-feed .feed-empty { text-align: center; color: var(--text-tertiary); font-size: 12px; padding: 24px 0; }
.mon-panel-risk { max-height: 96px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.mon-risk-item {
  font-size: 12px; line-height: 1.5;
  border-radius: 6px; padding: 6px 8px;
  border-left: 3px solid #f59e0b;
  background: #fffbeb;
  color: var(--text-secondary);
}
.mon-risk-item.high { border-left-color: #ef4444; background: #fef2f2; color: #7f1d1d; }
.mon-risk-item .t { font-weight: 600; color: #b45309; }
.mon-risk-item.high .t { color: #b91c1c; }
.mon-panel-actions { display: flex; gap: 6px; }
.mon-panel-send { display: flex; gap: 6px; }
.mon-panel-send input {
  flex: 1; height: 32px;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 8px; padding: 0 10px;
  color: var(--text-primary); font-size: 13px;
  outline: none;
}
.mon-panel-send input:focus { border-color: var(--primary, #6366f1); }
.mon-panel-send input::placeholder { color: var(--text-tertiary); }
.mon-quick { display: flex; flex-wrap: wrap; gap: 4px; }
.mon-quick .q {
  font-size: 11px; padding: 3px 8px; border-radius: 999px;
  background: var(--primary-light); color: var(--primary-dark);
  border: 1px solid #d9dbfa;
  cursor: pointer;
}
.mon-quick .q:hover { background: #e3e6ff; }
.mon-panel-empty-note { font-size: 11px; color: var(--text-tertiary); text-align: center; padding: 6px 0; }
/* v1.9.1 面板内按钮适配白底 */
.mon-panel .btn-ghost { color: var(--text-secondary); }
.mon-panel .btn-ghost:hover { background: #e8eaf1; color: var(--text-primary); }

/* ===== 底部日志 ===== */
.log-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 32px;
  background: var(--topbar-bg);
  border-top: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center;
  padding: 0 20px;
  gap: 12px;
  font-size: 12px;
  color: var(--text-tertiary);
  z-index: 50;
  overflow: hidden;
}
.log-bar .log-label { color: var(--text-tertiary); font-weight: 500; flex-shrink: 0; }
.log-bar .log-content {
  flex: 1; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis;
}
.log-bar .log-content .time { color: var(--text-tertiary); margin-right: 8px; }

/* ===== 空状态 ===== */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-tertiary);
}
.empty-state .icon {
  width: 64px; height: 64px;
  margin: 0 auto 16px;
  background: var(--surface-hover);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
}
.empty-state .title { font-size: 16px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
.empty-state .desc { font-size: 13px; }

/* ===== Toast ===== */
.toast-container {
  position: fixed; top: 76px; right: 24px;
  z-index: 2000;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  background: var(--surface);
  border: 1px solid var(--border-light);
  border-radius: 10px;
  padding: 12px 18px;
  box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; font-weight: 500;
  animation: slideIn 0.25s;
  min-width: 240px;
}
@keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
.toast .ticon { width: 18px; height: 18px; flex-shrink: 0; }
.toast.success .ticon { color: var(--success); }
.toast.error .ticon { color: var(--danger); }
.toast.info .ticon { color: var(--info); }

/* ===== 工具类 ===== */
.hidden { display: none !important; }
.flex { display: flex; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.mt-2 { margin-top: 8px; }
.mt-3 { margin-top: 12px; }
.mb-2 { margin-bottom: 8px; }
.mb-3 { margin-bottom: 12px; }
.text-sm { font-size: 12px; }
.text-muted { color: var(--text-secondary); }
.text-danger { color: var(--danger); }
.text-success { color: var(--success); }
.font-mono { font-family: var(--mono); }

/* ===== 视觉升级：仅覆盖表现层，保留状态显隐、窗口拖拽与画布坐标 ===== */
:root {
  --bg: #f0f4f7;
  --surface: #ffffff;
  --surface-hover: #f3f7f9;
  --border: #d6e1e7;
  --border-light: #e5edf1;
  --text-primary: #18303e;
  --text-secondary: #526c7b;
  --text-tertiary: #738895;
  --primary: #087f8c;
  --primary-hover: #066674;
  --primary-light: #e5f5f5;
  --primary-dark: #076571;
  --success: #138568;
  --success-light: #eaf7f1;
  --warning: #bd7515;
  --warning-light: #fff7e7;
  --danger: #cf4052;
  --danger-light: #fff0f2;
  --info: #2878ae;
  --topbar-bg: #102c3c;
  --topbar-text: #e1edf2;
  --sidebar-bg: #f9fbfc;
  --radius-sm: 7px;
  --radius: 12px;
  --radius-lg: 18px;
  --shadow-sm: 0 2px 5px rgba(20, 53, 69, .035);
  --shadow: 0 6px 22px rgba(20, 53, 69, .07);
  --shadow-lg: 0 20px 64px rgba(13, 40, 54, .19);
  --font: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif;
}
body { min-width: 1080px; background: var(--bg); line-height: 1.6; }
::selection { background: #bee9e9; color: #123b47; }
::-webkit-scrollbar-thumb { background: #bdcdd6; border: 2px solid transparent; background-clip: padding-box; border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background-color: #91a9b6; }
button, input, select, textarea { accent-color: var(--primary); }
button:focus-visible, .nav-item:focus-visible, .stream-tab:focus-visible {
  outline: 2px solid var(--primary); outline-offset: 3px;
}
.topbar { height: 72px; padding: 0 28px; gap: 12px; border-bottom: 1px solid #244756; box-shadow: 0 3px 16px #102c3c12; }
.logo-wrap { gap: 13px; flex-shrink: 0; }
.logo-icon { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(145deg, #39d5ce, #087f8c); box-shadow: inset 0 1px 0 #ffffff55; }
.logo-title { font-size: 18px; letter-spacing: .6px; }
.logo-sub { color: #a5bdc8; font-size: 11px; }
.topbar-btn { height: 38px; border-radius: 9px; padding: 0 14px; border-color: #ffffff26; background: #ffffff05; }
.topbar-btn:hover { background: #ffffff10; border-color: #ffffff45; }
.topbar-btn.primary { background: #0b929c; border-color: #27abb1; box-shadow: 0 3px 12px #00000015; }
.topbar-btn.primary:hover { background: #0c7b88; }
.layout { min-height: calc(100vh - 72px); }
.sidebar { width: 216px; padding: 24px 12px 92px; border-right-color: var(--border); gap: 4px; }
.nav-item { padding: 13px 14px; border-left: 3px solid transparent; border-radius: 11px; font-size: 13px; }
.nav-item.active { border-left-color: var(--primary); background: var(--primary-light); }
.nav-item .badge { padding: 2px 8px; background: var(--primary-dark); }
.sidebar-divider { margin: 20px 8px; }
.overview-panel { padding: 0 4px; }
.overview-title { color: var(--text-secondary); margin-bottom: 14px; letter-spacing: 1px; }
.overview-title .link { font-size: 12px; }
.overview-card { padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow-sm); border-color: var(--border-light); }
.overview-row { align-items: center; gap: 6px; padding: 3px 0 7px; }
.overview-value { font-variant-numeric: tabular-nums; letter-spacing: -.4px; }
.overview-sub { line-height: 1.7; }
.overview-alert { border-color: #ecd8ab; color: #81591e; }
main.main { padding: 28px 30px 76px; }
.page-header { margin-bottom: 24px; gap: 20px; flex-wrap: wrap; }
.page-title { font-size: 26px; letter-spacing: -.6px; line-height: 1.35; }
.page-subtitle { margin-top: 7px; }
.account-grid, .node-list { gap: 20px; }
.account-card { border-color: var(--border); box-shadow: var(--shadow-sm); }
.account-card:hover { box-shadow: var(--shadow); }
.metrics-bar { padding: 22px 20px 18px; background: linear-gradient(180deg, #f7fbfc, #ffffff); gap: 12px; }
.metric-value { font-size: 28px; letter-spacing: -.6px; }
.metric-label { margin-top: 7px; font-size: 11px; }
.card-actions-bar { padding: 18px 20px; gap: 12px; }
.actions-row { gap: 9px; }
.actions-row + .actions-row { margin-top: 12px; }
.action-group-label { color: var(--text-secondary); letter-spacing: .3px; }
.actions-row-tools .action-group-label { margin-left: 10px; }
.btn { border-radius: 9px; transition: background-color .15s, border-color .15s, box-shadow .15s; }
.btn-primary, .btn-main { box-shadow: 0 3px 8px #087f8c1a; }
.btn-main { padding: 0 22px; border-radius: 10px; }
.btn-secondary { background: #eaf2f5; border-color: #ccdde5; color: #355665; box-shadow: none; }
.btn-secondary:hover { background: #dfecef; border-color: #a7c4cf; }
.btn-ghost { background: #ffffff; border-color: var(--border); color: var(--text-secondary); box-shadow: none; }
.btn-ghost:hover { background: var(--surface-hover); border-color: #a7c4cf; color: var(--text-primary); }
.btn-success:hover { background: #0e6c54; }
.btn-danger:hover { background: #b52e41; }
.btn-main.btn-success, .btn-main.btn-danger { box-shadow: var(--shadow-sm); }
.btn-sm { border-radius: 7px; }
.status-tag { border-radius: 7px; padding: 4px 9px; }
.room-badge { background: var(--primary-light); color: var(--primary-dark); }
.push-video-tag, .signer-badge { background: #f3f7f9; border-color: var(--border); }
.account-input, .form-input, .prop-input, .engine-select, .select, .textarea, .mon-panel-send input {
  background: #fbfdfe; color: var(--text-primary); border-color: var(--border); border-radius: 9px;
  transition: border-color .15s, box-shadow .15s;
}
.account-input:focus, .form-input:focus, .prop-input:focus, .engine-select:focus, .select:focus, .textarea:focus, .mon-panel-send input:focus {
  border-color: var(--primary); box-shadow: 0 0 0 3px #087f8c15;
}
input::placeholder, textarea::placeholder { color: var(--text-tertiary); }
.form-label { margin-bottom: 8px; }
.form-group { margin-bottom: 20px; }
.form-desc, .hint-text { line-height: 1.8; }

<script>
// v1.15.1 修复：isElectron 必须最先定义（此前在 2480 行定义，
// 而 1240 行 syncNodesFromMainOnBoot IIFE 提前访问 → TDZ ReferenceError → 前端脚本整体中断 → 软件全部功能失效）
const isElectron = !!(window.tkAPI && window.tkAPI.isElectron && window.tkAPI.isElectron());
// ============================================================
// 离线授权登录遮罩（签名验证 / 机器绑定 / 永久有效）
// ============================================================
(function licenseGate() {
  const ov = document.getElementById('licenseOverlay');
  const msg = document.getElementById('licMsg');
  const input = document.getElementById('licCode');
  const btn = document.getElementById('licBtn');
  const mch = document.getElementById('licMachine');
  if (!ov || !window.tkAPI || !window.tkAPI.licenseCheck) return;
  window.tkAPI.licenseCheck().then(st => {
    if (!st || st.ok) return; // 已激活直接放行
    if (mch) mch.textContent = st.machine || '';
    ov.style.display = 'flex';
    if (st.reason === 'machine_mismatch') {
      msg.style.color = '#f0a64a';
      msg.textContent = '授权码属于其他电脑，请获取本机授权码';
    }
    btn.onclick = () => {
      const code = (input.value || '').trim();
      if (!code) { msg.style.color = '#f87171'; msg.textContent = '请粘贴授权码'; return; }
      btn.disabled = true; btn.textContent = '验证中…';
      window.tkAPI.licenseActivate({ code }).then(r => {
        if (r && r.ok) {
          msg.style.color = '#4ade80';
          msg.textContent = '激活成功，正在进入…';
          setTimeout(() => { ov.style.display = 'none'; }, 700);
        } else {
          btn.disabled = false; btn.textContent = '激 活';
          const txt = r && r.reason === 'format' ? '授权码格式不正确'
            : r && r.reason === 'invalid' ? '授权码无效，请检查后重新输入'
            : r && r.reason === 'machine_mismatch' ? '授权码属于其他电脑'
            : r && r.reason === 'storage_error' ? '无法读写授权文件，请检查目录权限'
            : '激活失败，请重试';
          msg.style.color = '#f87171';
          msg.textContent = '❌ ' + txt;
        }
      }).catch(() => { btn.disabled = false; btn.textContent = '激 活'; msg.textContent = '❌ 激活失败，请重试'; });
    };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
    input.focus();
  }).catch(() => {});
})();

// ============================================================
// 状态管理
// ============================================================
const STORAGE_KEY = 'tk_workbench_state_v3';
const STORAGE_KEY_V2 = 'tk_workbench_state_v2';

const defaultState = {
  broadcast: true,
  accounts: [],           // 零预置：房间全部由用户自己添加（一个房间一个号）
  nodes: [],
  partnerRooms: [],
  currentRoute: 'mobile',
  nextAccountId: 1,
  nextNodeId: 1,
  nextLayerId: 1,
  editorScenes: {},
};

let state = loadState();

// v1.14.19 节点权威来源修复：localStorage 保存有异步落盘延迟，添加节点后立即重启会丢节点列表；
// 启动后异步从主进程 nodes.json（代理实际使用的权威数据）补回缺失节点。
(function syncNodesFromMainOnBoot() {
  if (!isElectron || !window.tkAPI || !window.tkAPI.getNodes) return;
  window.tkAPI.getNodes().then(res => {
    try {
      if (!res || !Array.isArray(res.nodes)) return;
      const mainNodes = res.nodes.map(n => ({
        id: n.id,
        name: n.name || ('节点' + n.id),
        type: (n.link || '').startsWith('vless') ? 'vless' : ((n.link || '').startsWith('vmess') ? 'vmess' : 'socks5'),
        url: n.link,
        status: 'disconnected',
        testResult: '',
        assignedAccounts: 0,
      }));
      // nodes.json 是实际出口的事实源，同 ID 的旧链接及已删除节点也必须同步。
      let changed = JSON.stringify(state.nodes.map(n => ({ id: n.id, name: n.name, url: n.url }))) !== JSON.stringify(mainNodes.map(n => ({ id: n.id, name: n.name, url: n.url })));
      state.nodes = mainNodes;
      const maxId = mainNodes.reduce((m, n) => Math.max(m, n.id + 1), 1);
      if (maxId > state.nextNodeId) { state.nextNodeId = maxId; changed = true; }
      if (changed) { saveState(); render(); }
    } catch (e) { console.warn('同步主进程节点失败', e); }
  }).catch(() => {});
})();

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    const savedV2 = localStorage.getItem(STORAGE_KEY_V2);
    const parsed = saved ? JSON.parse(saved) : null;
    const parsedV2 = savedV2 ? JSON.parse(savedV2) : null;
    const base = mergeState(parsed, parsedV2);
    // v1.12.9 重启后主进程监控/推流不会自动恢复：重置为未启动状态，避免"监控窗口"假状态导致实时动态无数据
    (base.accounts || []).forEach(a => { a.monitorRunning = false; a.streaming = false; a.connecting = false; a.starting = false; if (a.status === 'streaming' || a.status === 'live') a.status = 'connected'; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(base));
    return base;
  } catch (e) { console.warn('加载状态失败', e); }
  return JSON.parse(JSON.stringify(defaultState));
}

// 合并：只保留用户真正操作过的房间（自建 id>=5、或改过名/已登录/分配过节点/roomName 非默认预置名）；
// 预置的「房间 1-4」一律丢弃，任何演示都不要。用户自填节点保留但重置假测试状态。
function mergeState(parsed, parsedV2) {
  const base = JSON.parse(JSON.stringify(defaultState));
  const src = parsed || parsedV2;
  const defaultNames = ['房间 1', '房间 2', '房间 3', '房间 4'];

  if (src && Array.isArray(src.accounts)) {
    base.accounts = src.accounts.filter(a => a && (
      a.id >= 5 ||
      a.name ||
      a.loggedIn ||
      a.nodeId ||
      !defaultNames.includes(a.roomName)
    ));
    // v1.9.0 补齐旧账号缺失字段（自动互动配置/风险记录），避免渲染报错
    base.accounts.forEach(a => {
      if (!a.autoInteract) a.autoInteract = { enabled: false, lang: '英语(美区)', coldStart: false, welcomeMsg: '欢迎来到直播间。喜欢的朋友可以点个关注。有问题欢迎留言。', replyRules: [] };
      if (!a.autoInteract.replyRules) a.autoInteract.replyRules = [];
      if (!a.autoInteract.welcomeMsg) a.autoInteract.welcomeMsg = '欢迎来到直播间。喜欢的朋友可以点个关注。有问题欢迎留言。';
      if (!a.metrics) a.metrics = { online: 0, likes: 0, gifts: 0, follows: 0, enters: 0, comments: 0 };
      if (!a.risks) a.risks = [];
      // v1.13.10 重启强制清空运行时数据残留：feed/风险/统计都是"直播进行时"的数据，跨重启恢复就是假数据（用户要求绝对真实，开播重记、下播清零）
      a.feed = [];
      a.risks = [];
      a.metrics = { online: 0, likes: 0, gifts: 0, follows: 0, enters: 0, comments: 0 };
      a.liveStartedAt = null;
      // v1.9.4 重启后强制重置运行态：推流/直播状态是运行时事实，不能从上次残留（避免假"直播中"）
      a.streaming = false;
      a.connecting = false;
      a.starting = false;
      a.delayed = false; // v1.13.11 自动推流等待态不跨重启
      a.delayedUntil = null;
      a.retrying = false; // v1.13.12 duplicate 重试态不跨重启
      a.status = 'connected';
    });
  }

  base.broadcast = src && src.broadcast !== undefined ? src.broadcast : base.broadcast;
  // 场景图层：仅保留仍在房间列表里的场景；丢弃重启后必然失效的 blob 引用图层（文件无法恢复，避免编辑器残留占位）
  base.editorScenes = {};
  const validAccIds = new Set(base.accounts.map(a => a.id));
  if (src && src.editorScenes) {
    Object.entries(src.editorScenes).forEach(([accId, s]) => {
      if (!s || !validAccIds.has(parseInt(accId, 10))) return;
      const layers = (s.layers || []).filter(l => !(l && typeof l.src === 'string' && l.src.startsWith('blob:')));
      base.editorScenes[accId] = { ...s, layers, selectedLayerId: layers.some(l => l.id === s.selectedLayerId) ? s.selectedLayerId : null };
    });
  }

  // 图层 id 必须保持全局唯一，否则新上传的视频/图片会与旧图层冲突（导致加不进去/选错）
  let maxLayer = 0;
  Object.values(base.editorScenes).forEach(s => {
    (s.layers || []).forEach(l => { if (l.id > maxLayer) maxLayer = l.id; });
  });
  base.nextLayerId = maxLayer + 1;

  // 节点：仅迁移用户自填节点（丢弃 v1.1 预置演示「美8/美9/美11/美12」），测试状态一律重置
  const nodeSrc = parsedV2 || parsed;
  if (nodeSrc && nodeSrc.nodes && nodeSrc.nodes.length) {
    const kept = nodeSrc.nodes.filter(n => !/美(8|9|11|12)/.test(n.name || ''));
    base.nodes = kept.map(n => ({
      id: n.id, name: n.name, type: n.type, url: n.url,
      status: 'disconnected', testResult: '', assignedAccounts: 0,
    }));
    base.nextNodeId = kept.reduce((m, n) => Math.max(m, n.id + 1), 1);
  }

  const maxAcc = base.accounts.reduce((m, a) => Math.max(m, a.id + 1), 1);
  base.nextAccountId = Math.max(maxAcc, (src && src.nextAccountId) || 1);
  return base;
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) { console.warn('保存状态失败', e); }
}

// ============================================================
// 日志
// ============================================================
function addLog(text) {
  const now = new Date();
  const time = now.toLocaleTimeString('zh-CN', { hour12: false });
  // v1.12.16 独立监控窗口无主界面日志区：找不到容器时跳过 DOM 更新（否则 null 报错→所有按钮点击无反应）
  const tEl = document.getElementById('logTime');
  const eEl = document.getElementById('logText');
  if (tEl) tEl.textContent = '[' + time + ']';
  if (eEl) eEl.textContent = text;
  // 保留最近 3 条历史，便于查看流程推进
  if (!addLog._hist) addLog._hist = [];
  addLog._hist.unshift('[' + time + '] ' + text);
  if (addLog._hist.length > 3) addLog._hist.length = 3;
  if (eEl) eEl.title = addLog._hist.join('\n');
  // v1.6.3 全部日志：完整记录到数组，支持「查看全部日志」
  if (!addLog._all) addLog._all = [];
  addLog._all.unshift('[' + time + '] ' + text);
  if (addLog._all.length > 2000) addLog._all.length = 2000;
}

// v1.6.3 查看全部日志（弹窗展示完整运行日志）
function showAllLogs() {
  const logs = (addLog._all || []).slice().reverse();
  const html = logs.length
    ? logs.map(l => escapeHtml(l)).join('<br>')
    : '<div style="color:var(--text-tertiary);text-align:center;padding:20px">暂无日志</div>';
  showModal('全部运行日志', `<div style="max-height:60vh;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.7;word-break:break-all;background:#0d1117;border-radius:8px;padding:12px;color:#c9d1d9">${html}</div>`, [
    { text: '导出诊断包', class: 'btn-primary', action: () => { exportDiagnostics(); } },
    { text: '清空日志', class: 'btn-danger', action: () => { addLog._all = []; addLog._hist = []; closeModal(); showToast('日志已清空', 'info'); } },
    { text: '关闭', class: 'btn-secondary' },
  ]);
}

// v1.14.5 一键导出诊断包（日志+代理状态+节点打码+账号摘要 → 桌面 txt）
function exportDiagnostics() {
  if (!isElectron || !window.tkAPI || !window.tkAPI.exportDiagnostics) { showToast('请使用桌面版导出', 'warning'); return; }
  showToast('正在生成诊断包...', 'info');
  window.tkAPI.exportDiagnostics().then((res) => {
    if (res && res.success) {
      navigator.clipboard?.writeText(res.path).catch(() => {});
      showModal('诊断包已导出', `
        <div style="font-size:12px;line-height:1.8">
          诊断包已保存到：<br>
          <div style="background:var(--bg-elevated);border:1px solid var(--border-light);border-radius:8px;padding:10px;word-break:break-all;font-family:var(--mono)">${res.path}</div>
          <div class="form-desc" style="margin-top:10px">路径已自动复制到剪贴板。<br>请把这个 txt 文件发给技术人员分析（含日志/代理状态/节点格式打码/账号摘要，不含 Cookie 明文）。</div>
        </div>
      `, [{ text: '关闭', class: 'btn-secondary' }]);
    } else {
      showToast('导出失败: ' + (res && res.error), 'error');
    }
  }).catch(() => showToast('导出失败', 'error'));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// 运行进度：日志区显示房间 + 百分比 + 进度条
function updateProgress(data) {
  const box = document.getElementById('logProgress');
  const textEl = document.getElementById('logProgressText');
  const fill = document.getElementById('pbarFill');
  if (!box || !textEl || !fill) return;
  const pct = data && data.pct ? data.pct : 0;
  const acc = state.accounts.find(a => String(a.id) === String(data.accountId));
  const roomLabel = acc ? (acc.roomName || ('房间 ' + acc.id)) : ('房间 ' + (data.accountId || ''));
  box.style.display = 'inline-flex';
  textEl.textContent = roomLabel + ' · ' + pct + '% ' + (data.message || '');
  fill.style.width = pct + '%';
  if (pct >= 100) {
    setTimeout(() => { box.style.display = 'none'; }, 6000);
  }
  addLog((data.message || '') + '（' + roomLabel + '，' + pct + '%）');
}

// ============================================================
// Toast
// ============================================================
function showToast(message, type = 'info') {
  // v1.12.16 独立监控窗口无 toastContainer：动态创建（否则 null 报错→按钮点击无反应）
  let container = document.getElementById('toastContainer');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toastContainer';
    container.style.cssText = 'position:fixed;top:16px;right:16px;z-index:99999;display:flex;flex-direction:column;gap:8px;';
    document.body.appendChild(container);
  }
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  const icons = {
    success: '<svg class="ticon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    error: '<svg class="ticon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
    info: '<svg class="ticon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
  };
  toast.innerHTML = (icons[type] || icons.info) + '<span>' + message + '</span>';
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(20px)';
    toast.style.transition = 'all 0.25s';
    setTimeout(() => toast.remove(), 250);
  }, 2800);
}

// ============================================================
// 渲染主函数
// ============================================================
function render() {
  // v1.10.1 独立监控窗口模式：不渲染主界面（只显示监控面板）
  if (document.body.classList.contains('monitor-mode')) return;
  const main = document.getElementById('mainContent');
  if (state.currentRoute === 'mobile') {
    main.innerHTML = renderMobileView();
  } else if (state.currentRoute === 'partner') {
    main.innerHTML = renderPartnerView();
  } else if (state.currentRoute === 'nodes') {
    main.innerHTML = renderNodeView();
  } else if (state.currentRoute === 'editor') {
    main.innerHTML = renderEditorView();
  }
  updateOverview();
  updateCounts();
  refreshSignerBadges();
}

// v1.12.36 签名服务状态刷新（账号卡片可见：已配置/未配置 + 最近自动生成）
function refreshSignerBadges() {
  state.accounts.forEach(acc => {
    const el = document.getElementById('signerBadge_' + acc.id);
    if (!el) return;
    if (!window.tkAPI || !window.tkAPI.signerStatus) return;
    window.tkAPI.signerStatus({ accountId: acc.id }).then(s => {
      if (!s) return;
      // v1.14.7 内置签名：未自定义时显示「签名:内置」，无需手动配置
      el.textContent = s.configured
        ? ('签名:' + (s.builtin ? '内置(••••' : '已配置(••••') + (s.keyTail || '') + ')' + (s.lastOk ? ' · 已自动生成' : ''))
        : '签名:未配置';
    }).catch(() => {});
  });
}

function updateCounts() {
  const mc = document.getElementById('mobileCount');
  if (mc) mc.textContent = state.accounts.length;
}

function typeLabel(type) {
  return { comment: '评论', enter: '进场', gift: '礼物', like: '点赞', follow: '关注', system: '系统', risk: '风险', online: '在线' }[type] || type;
}

function formatNum(n) {
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return n.toString();
}

function getScene(accId) {
  if (!state.editorScenes[accId]) {
    state.editorScenes[accId] = {
      layers: [],
      selectedLayerId: null,
      outputVolume: 1,
      monitorEnabled: false,
    };
  }
  return state.editorScenes[accId];
}

// ============================================================
// 实时总览更新
// ============================================================
function updateOverview() {
  const total = state.accounts.length;
  const connected = state.accounts.filter(a => a.status === 'connected' || a.status === 'live').length;
  const streaming = state.accounts.filter(a => a.streaming).length;
  const errors = state.accounts.filter(a => a.status === 'error').length;

  document.getElementById('ovTotal').innerHTML = total + '<span class="unit">个</span>';
  document.getElementById('ovSub').textContent = '当前已添加账号';
  document.getElementById('ovMonitor').textContent = connected + ' / ' + total;
  document.getElementById('ovMonitorSub').textContent = '已登录 ' + connected;
  document.getElementById('ovStream').innerHTML = '上传中 ' + streaming;
  document.getElementById('ovStreamSub').textContent = '推流失败 ' + errors + ' · 房间异常 ' + errors;
  document.getElementById('ovRooms').textContent = '已配置 ' + total + ' 个';
  document.getElementById('ovRoomsSub').textContent = '已配置' + (total - errors) + ' · 异常' + errors;

  const alertEl = document.getElementById('ovAlert');
  if (total === 0) {
    alertEl.style.display = 'block';
    document.getElementById('ovAlertText').textContent = '暂无房间：点右上角「+ 添加账号」创建（一个房间一个号）';
  } else if (errors > 0 || connected < total) {
    alertEl.style.display = 'block';
    document.getElementById('ovAlertText').textContent = '部分状态需要关注：' + (total - connected) + ' 个房间未登录 · 推流失败' + errors;
  } else {
    alertEl.style.display = 'none';
  }
}

function refreshOverview() {
  updateOverview();
  showToast('总览已刷新', 'success');
}

function loginAccount(id) {
  const acc = state.accounts.find(a => String(a.id) === String(id));
  if (!acc) return;

  if (isElectron && window.tkAPI) {
    // 桌面版：为该房间新建独立登录窗口（每账号独立会话，登录后自动抓取 Cookie）
    showToast('正在为 ' + (acc.roomName || ('房间 ' + id)) + ' 新建独立登录窗口...', 'info');
    addLog('打开独立登录窗口: ' + (acc.roomName || ('房间 ' + id)) + (acc.name ? ' @' + acc.name : ''));
    window.tkAPI.openTikTokLogin({ accountId: id, accountName: acc.name }).then(result => {
      if (!result.success) { addLog('登录页面加载失败: ' + result.error); showToast('登录页面加载失败: ' + result.error, 'error'); }
    }).catch(error => { addLog('登录失败: ' + error.message); showToast('登录失败: ' + error.message, 'error'); });

    // 监听登录态变化（Cookie 自动抓取成功后回写）
    if (!window._loginStateBound) {
      window.tkAPI.onLoginStateChanged(({ accountId, loggedIn, cookieCount, capturedAt }) => {
        const a = state.accounts.find(x => String(x.id) === String(accountId));
        if (a) {
          a.loggedIn = loggedIn;
          if (loggedIn) {
            a.status = 'connected';
            a.cookieInfo = { cookieCount: cookieCount || 0, capturedAt };
            showToast('房间' + accountId + ' Cookie 已自动抓取（' + (cookieCount || 0) + ' 条）', 'success');
            addLog('房间' + accountId + ' 登录成功，Cookie 已自动保存');
          } else {
            a.loggedIn = false;
            a.cookieInfo = null;
            a.status = 'disconnected';
            addLog('房间' + accountId + ' 登录态已清除');
          }
          saveState();
          if (state.currentRoute === 'mobile') render();
        }
      });
      window._loginStateBound = true;
    }

    // 启动时回读一次该房间已保存的登录态
    window.tkAPI.getAccountAuth({ accountId: id }).then((auth) => {
      const a = state.accounts.find(x => String(x.id) === String(id));
      if (a && auth && auth.loggedIn && !a.loggedIn) {
        a.loggedIn = true;
        a.status = 'connected';
        a.cookieInfo = { cookieCount: auth.cookieCount || 0, capturedAt: auth.capturedAt };
        saveState();
        if (state.currentRoute === 'mobile') render();
      }
    });
  } else {
    showToast('请使用桌面版登录（当前为网页预览）', 'warning');
  }
}

// v1.6.4 手动填推流码：Electron 禁用 prompt，改用内置弹窗（textarea 粘贴）
function manualStreamKey(id) {
  const acc = state.accounts.find(a => String(a.id) === String(id));
  if (!acc) return;
  const cur = (acc.rtmpUrl || '') + (acc.streamKey ? '/' + acc.streamKey : '');
  showModal('手动填推流码 · 房间' + id, `
    <div style="font-size:13px;line-height:1.8;color:var(--text-secondary);margin-bottom:10px">
      从手机 App 开播页复制推流信息（<b>完整 rtmp:// 推流地址</b>，含 stream- 和签名）粘贴到下面：<br>
      <span style="color:var(--text-tertiary)">支持格式：<br>① 完整推流地址（推荐）：rtmp://push-xxx.tiktokcdn.com/stage/stream-123?sign=...<br>② 地址 + 空格 + 推流码</span>
    </div>
    <textarea id="manualKeyInput" style="width:100%;min-height:100px;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:10px;font-family:var(--mono);font-size:12px;box-sizing:border-box" placeholder="rtmp://push-xxx.tiktokcdn.com/stage/stream-123?sign=...">${escapeHtml(cur)}</textarea>
  `, [
    { text: '保存并使用', class: 'btn-primary', action: () => { const v = document.getElementById('manualKeyInput').value.trim(); if (!v) { showToast('内容为空，请先复制推流地址', 'warning'); return; } parseAndSaveManualKey(id, v); closeModal(); } },
    { text: '取消', class: 'btn-secondary' },
  ]);
}

function parseAndSaveManualKey(id, input) {
  const acc = state.accounts.find(a => String(a.id) === String(id));
  if (!acc) return;
  let rtmpUrl = '', streamKey = '';
  const m = input.match(/(rtmps?:\/\/[^\s"'<>]+)/i);
  if (m) {
    // 完整地址整体保存（含 query/签名），推流时 buildPushUrl 检测到 stream-/? 直接使用，不再拼接
    rtmpUrl = m[1].trim();
    const km = rtmpUrl.match(/stream-[^\s\/?]+/i);
    if (km) streamKey = km[0];
  } else if (/^stream-/i.test(input.trim())) {
    streamKey = input.trim();
    showToast('只有推流码不够：请把完整 rtmp:// 推流地址一起复制粘贴（手机 App 里两个通常同时显示）', 'warning');
    return;
  } else {
    showToast('无法识别：请粘贴 rtmp:// 开头的完整推流地址', 'error');
    return;
  }
  acc.rtmpUrl = rtmpUrl;
  acc.streamKey = streamKey;
  acc.status = 'connected';
  saveState();
  render();
  showToast('推流地址已保存，可直接开始推流', 'success');
  addLog((acc.roomName || ('房间 ' + acc.id)) + ' 手动填写推流地址: ' + rtmpUrl.substring(0, 90) + (rtmpUrl.length > 90 ? '...' : ''));
}

function getStreamKey(id, silent) {
  const acc = state.accounts.find(a => String(a.id) === String(id));
  if (!acc) return;
  if (!acc.loggedIn) {
    showToast('请先登录该房间（Cookie 登录）', 'error');
    return;
  }
  if (isElectron && window.tkAPI) {
    // 已持有推流码时提示直接用（换码请用「重新获取推流码」按钮）
    if (acc.streamKey) {
      showToast('房间已持有推流码，直接开始推流即可；换新推流码请点「重新获取推流码」', 'info');
      return;
    }
    if (acc.streaming) {
      showToast('请先停止推流，再获取推流码', 'warning');
      return;
    }
    fetchStreamKeyViaApi(id);
  } else {
    showToast('请使用桌面版获取真实推流码', 'warning');
  }
}

// v1.6.4 统一 API 拿码执行体（getStreamKey / regetStreamKey 共用）
function fetchStreamKeyViaApi(id) {
  const acc = state.accounts.find(a => String(a.id) === String(id));
  if (!acc) return;
  showToast('正在通过 API 通道获取推流码（自动创建直播间）...', 'info');
  addLog('自动获取推流码(API通道): 房间' + id + (acc.name ? ' @' + acc.name : ''));
  window.tkAPI.getStreamKeyByApi({ accountId: id, accountName: acc.name }).then(res => {
    if (res && res.success && res.rtmpUrl) {
      acc.status = 'connected';
      acc.rtmpUrl = res.rtmpUrl;
      acc.streamKey = res.streamKey || '';
      acc.roomId = res.roomId || '';
      saveState();
      if (state.currentRoute === 'mobile') render();
      showToast('推流码获取成功（' + (res.via || 'API 通道') + '），可直接开始推流', 'success');
      addLog((acc.roomName || ('房间 ' + acc.id)) + (acc.name ? ' @' + acc.name : '') + ' 推流码获取成功(' + (res.via || 'API') + '): ' + res.rtmpUrl);
      // v1.12.48 自动开播：画面编辑无视频层时自动使用默认素材循环播放，保证拿码后必然自动推流
      // v1.14.10 修复：默认素材不再写死用户桌面路径（换电脑失效）→ 从 软件数据目录\默认素材 动态查找，没有则提示手动选择
      const sc = getScene(id) || { layers: [] };
      let hasVideoLayer = (sc.layers || []).some(l => l.type === 'video' && l.filePath);
      if (!hasVideoLayer) {
        const defs = await (window.api.listDefaultVideos ? window.api.listDefaultVideos() : Promise.resolve([]));
        const defVideo = (defs && defs[0]) || '';
        if (defVideo) {
          if (!sc.layers) sc.layers = [];
          sc.layers.push({
            id: 'auto_' + Date.now(),
            type: 'video',
            name: '默认视频',
            filePath: defVideo,
            loop: true,
            volume: 1,
            x: 0, y: 0, w: 100, h: 100,
          });
          saveScene(id, sc);
          hasVideoLayer = true;
          addLog('画面编辑暂无视频，已自动添加默认素材（软件数据目录\\默认素材 下第一个视频）');
        } else {
          showToast('画面编辑没有视频素材，请在「画面编辑」里选择视频（或把素材放到 软件数据目录\\默认素材 文件夹）', 'warning');
        }
      }
      if (hasVideoLayer) {
        // v1.13.0 修复：不再自动开始推流（v1.12.48 自动开播在手机断网前就推 → duplicate → FFmpeg 退出 → 推流码被清空）
        // 正确时序：抓码 → 手机断网（勿点End，房间保留）→ 点「开始内置推流」→ 软件用当场码接管（观众看软件画面）
        addLog('推流码已就绪：手机断网后点「开始内置推流」接管（观众看软件画面）');
        showToast('推流码已就绪：手机断网后点「开始内置推流」', 'info');
      } else {
        addLog('画面编辑暂无视频，请在画面编辑中添加视频后点「开始内置推流」');
      }
    } else {
      // v1.12.33 不再自动打开 LIVE Studio（手机直播模式无推流码按钮，白等）；主进程已内置 CDP 捕获重试 2 轮，重试即可
      addLog('房间' + id + ' 推流码获取失败（' + ((res && res.error) || '未知错误') + '），请重新点击「获取推流码」重试（软件会自动重试捕获手机直播间推流码）');
      showToast('推流码获取失败，请重新点击「获取推流码」重试', 'warning');
    }
  });
}

// v1.12.34 签名服务配置（抖歪同款：RapidAPI 签名 → Node 直连拿推流码不被风控）
// v1.14.7 内置签名：默认已内置 4k版 RapidAPI 签名，新账号/新电脑无需配置；Key 留空 = 继续用内置
function signerConfig(id) {
  const acc = state.accounts.find(a => String(a.id) === String(id));
  if (!acc) return;
  const cfg = (acc.signer) || {};
  if (!cfg.apiKey) {
    const useBuiltin = confirm('当前使用内置签名服务（RapidAPI，无需配置）。\n\n确定要自定义签名服务吗？（点「取消」保持内置）');
    if (!useBuiltin) {
      showToast('继续使用内置签名服务', 'info');
      addLog('房间' + id + ' 使用内置签名服务（无需配置）');
      window.tkAPI.signerCheck({ accountId: id }).then(r => {
        if (r && r.success) addLog('房间' + id + ' 内置签名检测通过：' + r.message);
        else addLog('房间' + id + ' 内置签名检测失败：' + ((r && r.error) || '未知'));
      });
      return;
    }
  }
  const baseUrl = prompt('签名服务地址（默认 RapidAPI 抖歪同款服务，一般不用改）：', cfg.baseUrl || 'https://tiktok-live-studio-api-signer1.p.rapidapi.com/');
  if (baseUrl === null) return;
  const apiKey = prompt('RapidAPI Key（留空 = 恢复使用内置签名）：', cfg.apiKey || '');
  if (apiKey === null) return;
  const authMode = prompt('鉴权方式（header=X-RapidAPI-Key / bearer=Authorization，默认 header）：', cfg.authMode || 'header');
  if (authMode === null) return;
  if (!apiKey.trim()) {
    // v1.14.7 Key 留空：清除自定义，恢复内置签名
    acc.signer = {};
    saveState();
    showToast('已恢复使用内置签名服务', 'info');
    addLog('房间' + id + ' 已恢复内置签名服务');
    window.tkAPI.signerSave({ accountId: id, baseUrl: '', apiKey: '', authMode: 'header' }).then(r => {
      if (r && r.success) addLog('房间' + id + ' 内置签名配置已保存');
    });
    refreshSignerBadges();
    return;
  }
  acc.signer = { baseUrl: baseUrl.trim(), apiKey: apiKey.trim(), authMode: (authMode.trim() || 'header') };
  saveState();
  showToast('签名服务配置已保存，正在检测连通性...', 'info');
  window.tkAPI.signerSave({ accountId: id, baseUrl: acc.signer.baseUrl, apiKey: acc.signer.apiKey, authMode: acc.signer.authMode }).then(r => {
    if (r && r.success) addLog('房间' + id + ' 签名服务配置已保存');
    else addLog('房间' + id + ' 签名服务保存失败：' + ((r && r.error) || '未知'));
  });
  window.tkAPI.signerCheck({ accountId: id }).then(r => {
    if (r && r.success) { addLog('房间' + id + ' 签名服务检测通过：' + r.message); showToast('签名服务检测通过，获取推流码将走签名通道（不被风控）', 'success'); }
    else { addLog('房间' + id + ' 签名服务检测失败：' + ((r && r.error) || '未知错误')); showToast('签名服务检测失败：' + ((r && r.error) || '请核对 Key'), 'warning'); }
  });
}

// v1.6.4 重新获取推流码：清空旧码后走 API 重新获取（不被 getStreamKey 的已持有拦截）
function regetStreamKey(id) {
  const acc = state.accounts.find(a => String(a.id) === String(id));
  if (!acc) return;
  if (acc.streaming) { showToast('请先停止推流，再重新获取推流码', 'warning'); return; }
  if (!acc.loggedIn) { showToast('请先登录该房间（Cookie 登录）', 'error'); return; }
  acc.rtmpUrl = '';
  acc.streamKey = '';
  acc.roomId = '';
  acc.status = 'idle';
  saveState();
  render();
  showToast('正在重新获取推流码（清空旧推流码）...', 'info');
  addLog('重新获取推流码: 房间' + id + (acc.name ? ' @' + acc.name : '') + '（已清空旧码）');
  fetchStreamKeyViaApi(id);
}

// 等待该房间拿到推流码（轮询 state，超时返回 false）
function waitStreamKey(accountId, timeoutMs) {
  return new Promise((resolve) => {
    const t0 = Date.now();
    const iv = setInterval(() => {
      const a = state.accounts.find(x => String(x.id) === String(accountId));
      if (a && a.streamKey) { clearInterval(iv); resolve(true); }
      else if (Date.now() - t0 > timeoutMs) { clearInterval(iv); resolve(false); }
    }, 1000);
  });
}

// 确保房间已有推流码：没有则优先 API 通道自动获取；失败再打开直播中心页面扫描兜底
async function ensureStreamKey(acc, timeoutMs) {
  if (acc.streamKey) return true;
  if (!acc.loggedIn) { showToast('请先登录该房间', 'error'); return false; }
  if (isElectron && window.tkAPI) {
    addLog('自动获取推流码(API通道): 房间' + acc.id);
    showToast('正在通过 API 通道自动获取推流码...', 'info');
    try {
      const res = await window.tkAPI.getStreamKeyByApi({ accountId: acc.id, accountName: acc.name });
      if (res && res.success && res.rtmpUrl) {
        acc.status = 'connected';
        acc.rtmpUrl = res.rtmpUrl;
        acc.streamKey = res.streamKey || '';
        acc.roomId = res.roomId || '';
        saveState();
        showToast('推流码已自动获取（API 通道）', 'success');
        addLog('房间' + acc.id + ' 推流码已自动获取(API通道)');
        if (state.currentRoute === 'mobile') render();
        return true;
      }
      addLog('房间' + acc.id + ' API通道失败（' + ((res && res.error) || '未知错误') + '），切换页面扫描通道...');
    } catch (e) { addLog('房间' + acc.id + ' API通道异常: ' + e.message); }
    // 兜底：页面扫描通道
    showToast('API 通道暂不可用，打开直播中心自动抓取...', 'warning');
    window.tkAPI.openProducerWindow({ accountId: acc.id, accountName: acc.name, mode: 'mobile', autoClose: true });
    const got = await waitStreamKey(acc.id, timeoutMs || 60000); // v1.15.0 页面兜底等待 120 秒 → 60 秒（快速失败，不白等）
    if (got) {
      showToast('推流码已自动获取', 'success');
      addLog('房间' + acc.id + ' 推流码已自动获取');
    } else {
      showToast('未获取到推流码：请在直播中心窗口选择手机直播并点「获取推流码」', 'error');
      addLog('房间' + acc.id + ' 等待推流码超时，请手动在直播中心操作');
    }
    return got;
  }
  return false;
}

// ============================================================
// Electron 真实推流集成
// ============================================================
const streamFrameIntervals = {};  // accountId -> interval

async function startRealStream(acc) {
  if (!isElectron) {
    showToast('当前为网页预览版，推流需使用桌面版', 'warning');
    return false;
  }

  bindStreamEvents();

  // 检查FFmpeg
  const ffmpegStatus = await window.tkAPI.checkFFmpeg();
  if (!ffmpegStatus.available) {
    showToast('未检测到FFmpeg，请先安装并添加到系统PATH', 'error');
    addLog('推流失败：未检测到FFmpeg');
    return false;
  }

  // 解析推流地址（只使用真实抓取到的推流码，无任何预置地址）
  const streamInfo = (acc.streamKey || '').trim();
  let rtmpUrl = (acc.rtmpUrl || '').trim();
  let streamKey = streamInfo;

  if (!rtmpUrl || !streamKey) {
    showToast('缺少推流码：请先获取手机直播推流码', 'error');
    addLog('推流失败：未获取到手机直播推流码');
    return false;
  }

  // 如果推流码包含完整URL，解析出来
  if (streamInfo.startsWith('rtmp://') || streamInfo.startsWith('rtmps://')) {
    const lastSlash = streamInfo.lastIndexOf('/');
    if (lastSlash > 8) {
      rtmpUrl = streamInfo.substring(0, lastSlash);
      streamKey = streamInfo.substring(lastSlash + 1);
    }
  }

  // 如果用户手动输入了完整的推流地址（包含服务器和密钥），尝试解析
  if (streamInfo.includes('rtmp') && streamInfo.includes('stream-')) {
    const parts = streamInfo.split(/\s+/);
    for (const p of parts) {
      if (p.startsWith('rtmp')) rtmpUrl = p;
      else if (p.startsWith('stream-')) streamKey = p;
    }
  }

  if (!rtmpUrl || !streamKey) {
    showToast('推流码不完整：请重新获取手机直播推流码', 'error');
    addLog('推流失败：推流码不完整');
    return false;
  }

  // v1.12.52 推流素材优先用"选择视频"按钮选的视频；没有则用画面编辑器的视频图层
  const sceneVideos = (getScene(acc.id) || { layers: [] }).layers || [];
  const videoFilePaths = acc.pushVideo ? [acc.pushVideo] : sceneVideos.filter(l => l.type === 'video' && l.filePath).map(l => l.filePath);

  acc._streamStartStopped = false;
  acc.connecting = true;
  const result = await window.tkAPI.startStream({
    accountId: acc.id,
    rtmpUrl: rtmpUrl,
    streamKey: streamKey,
    videoFilePaths: videoFilePaths,
    roomId: acc.roomId || '',
  });

  if (!result.success) {
    acc.connecting = false;
    showToast('推流启动失败: ' + result.error, 'error');
    addLog('推流失败: ' + result.error);
    return false;
  }

  if (acc._streamStartStopped) return false;

  // v1.13.12 立即试探推流（不再固定等待）：duplicate（手机推流权未释放）时主进程自动 10 秒重试，前端按钮显示"推流重试中…"
  // 启动响应只代表进程建立，真正输出由日志事件确认。
  acc.connecting = !!result.connecting && !acc.streaming;
  acc.retrying = false;
  acc.delayed = false;
  acc.delayedUntil = null;
  saveState();
  render();

  // 启动帧推送
  startFramePushing(acc.id);

  return true;
}

function bindStreamEvents() {
  // 监听推流日志
  if (!window._streamLogBound) {
    window.tkAPI.onStreamLog(({ accountId, log }) => {
      addLog('房间 ' + accountId + ': ' + log.trim());
      if (log.includes('error') || log.includes('Error')) {
        console.warn('[FFmpeg]', log.trim());
      }
      // 自动重试的画布输入也要在连接阶段恢复，不能等首次输出后才送帧。
      if (log.includes('进程已创建，正在连接')) {
        const a = state.accounts.find(x => String(x.id) === String(accountId));
        if (a) { a._streamStartStopped = false; a.connecting = true; a.retrying = false; startFramePushing(accountId); saveState(); render(); }
      }
      // v1.13.12 推流启动（含 duplicate 自动重试成功）→ 切回"停止推流"并恢复帧推送
      if (log.includes('推流已启动')) {
        const a = state.accounts.find(x => String(x.id) === String(accountId));
        if (a) {
          a.retrying = false;
          a.delayed = false;
          a.connecting = false;
          a.streaming = true;
          a.status = 'live';
          if (!a.liveStartedAt) a.liveStartedAt = Date.now();
          startFramePushing(accountId);
          saveState(); render();
        }
      }
    });
    window.tkAPI.onStreamError(({ accountId, error }) => {
      const a = state.accounts.find(x => String(x.id) === String(accountId));
      if (a) { a._streamStartStopped = true; a.connecting = false; a.streaming = false; a.status = 'connected'; a.delayed = false; a.delayedUntil = null; a.retrying = false; stopFramePushing(accountId); saveState(); render(); }
      addLog('推流错误: ' + error);
      showToast('推流出错: ' + error, 'error');
    });
    window.tkAPI.onStreamStopped(({ accountId, code, duplicate, retrying, autoDown, user, error }) => {
      const a = state.accounts.find(x => String(x.id) === String(accountId));
      if (a) {
        a._streamStartStopped = true;
        a.streaming = false;
        a.connecting = false;
        a.delayed = false; // v1.13.11 自动推流被取消/结束 → 清等待状态
        a.delayedUntil = null;
        // v1.13.12 duplicate 自动重试中：按钮切"推流重试中…(点击取消)"，不弹失败长提示
        if (retrying) {
          a.retrying = true;
          a.status = 'connected';
          stopFramePushing(accountId);
          saveState(); render();
          return;
        }
        a.retrying = false;
        a.status = 'connected';
        stopFramePushing(accountId);
        // v1.15.0 手机下播自动检测停止 → 前端同步清空推流码（主进程已清，双端一致）
        if (autoDown) {
          a.streamKey = ''; a.rtmpUrl = ''; a.roomId = '';
          addLog((a.roomName || ('房间 ' + a.id)) + ' 已识别手机端下播：推流码已清空');
          saveState();
          if (state.currentRoute === 'mobile') render();
          return;
        }
        // v1.13.8 推流结束/掉流 → 明确失败原因，码保留显示（便于判断），不静默清空
        if (user) { saveState(); render(); return; }
        let why = error || '推流已结束';
        if (duplicate) why = '推流被服务器拒绝（duplicate：同房间已有手机推流，手机断网后平台未释放推流权）。请等待 30-60 秒让平台释放推流权（或确认手机已完全断网），再重新获取当场新码后重试';
        else if (code === 4294957243 || code === -10053) why = '推流被服务器中止（连接断开：手机断网后房间可能已被平台结束，或网络波动；请确认另一设备是否仍能看到直播间，若已结束请重新开播抓当场新码）';
        else if (code === 4294967295 || code === -1) why = '推流异常退出（服务器关闭连接或素材解码错误）';
        if (a.streamKey) {
          addLog((a.roomName || ('房间 ' + a.id)) + ' ' + why + '（推流码保留显示，重推请重新获取当场新码）');
          showToast(why, 'error');
        } else {
          addLog((a.roomName || ('房间 ' + a.id)) + ' ' + why);
        }
        saveState();
        if (state.currentRoute === 'mobile') render();
      }
    });
    window._streamLogBound = true;
  }

}

function startFramePushing(accountId) {
  stopFramePushing(accountId);
  let frameCount = 0;
  // 画面编辑引擎会持续把该房间的图层（视频/图片）渲染到离屏画布，
  // 这里始终从离屏画布取帧，保证无论停留在哪个页面，推流画面都是画面编辑输出
  streamFrameIntervals[accountId] = setInterval(async () => {
    const canvas = getOffscreenCanvas(accountId);
    if (!canvas) return;
    try {
      // 用JPEG压缩减少IPC数据量
      const jpegUrl = canvas.toDataURL('image/jpeg', 0.75);
      const base64 = jpegUrl.split(',')[1];
      await window.tkAPI.pushFrame({ accountId, frameData: base64 });
      frameCount++;
    } catch (e) {
      console.warn('帧推送失败:', e.message);
    }
  }, 66); // ~15fps
}

function stopFramePushing(accountId) {
  if (streamFrameIntervals[accountId]) {
    clearInterval(streamFrameIntervals[accountId]);
    delete streamFrameIntervals[accountId];
  }
}

async function stopRealStream(accountId) {
  if (isElectron) {
    await window.tkAPI.stopStream({ accountId });
  }
  stopFramePushing(accountId);
}

function toggleStream(id) {
  const acc = state.accounts.find(a => String(a.id) === String(id));
  if (!acc) return;
  // v1.14.13 启动互斥（前端）：startRealStream 异步期间（等推流码/主进程启动 FFmpeg）按钮锁定，防止连点产生多路并发推流互相杀
  if (acc.starting) return;
  // v1.13.12 推流重试阶段：点击 = 取消重试（主进程已清除重试链）
  if (acc.retrying && !acc.streaming) {
    if (window.tkAPI) window.tkAPI.stopStream({ accountId: id }).catch(() => {});
    acc.retrying = false;
    saveState(); render();
    addLog((acc.roomName || ('房间 ' + id)) + ' 已取消推流重试');
    showToast('已取消推流重试', 'info');
    return;
  }
  // v1.13.11 兼容旧等待态（不应出现，兜底清理）
  if (acc.delayed && !acc.streaming) {
    if (window.tkAPI) window.tkAPI.stopStream({ accountId: id }).catch(() => {});
    acc.delayed = false; acc.delayedUntil = null;
    saveState(); render();
    return;
  }
  if (acc.streaming || acc.connecting) {
    stopRealStream(id);
    acc.connecting = false;
    acc.streaming = false;
    acc.status = 'connected';
    acc.liveStartedAt = null;
    // v1.12.44 停止推流/下播后清空推流码：下次开播必须重新获取（每次直播用当场新码，不用旧码）
    acc.streamKey = '';
    showToast('已停止推流（推流码已清空，下次开播自动重新获取）', 'info');
    addLog((acc.roomName || ('房间 ' + acc.id)) + ' 已停止推流（推流码已清空，下次开播自动重新获取新码）');
    saveState();
    render();
    return;
  }
  const roomLabel = acc.roomName || ('房间 ' + acc.id);
  showConfirmModal('开始内置推流（手机流接管）', roomLabel + (acc.name ? ' @' + acc.name : '') + '\n手机流接管流程：\n1. 手机先开播（Device camera）\n2. 点「获取推流码」拿到本场当场码\n3. 点「开始内置推流」→ 立即手机断网/飞行模式（勿点End，房间保留）\n4. 软件立即尝试推流；若手机推流权未释放会自动重试（10 秒一次，最多 6 次），成功即观众看软件画面\n\n重试期间按钮显示「推流重试中…(点击取消)」可取消。手机恢复网络会被顶回（平台机制）。没有推流码时会自动获取。', async () => {
    if (acc.starting) return; // v1.14.13 二次保险：确认回调里也判锁
    acc.starting = true; // v1.14.13 启动锁：按钮切"正在启动…"禁用，防止连点
    saveState(); render();
    try {
      // 自动确保推流码（未登录会提示登录）
      const hasKey = await ensureStreamKey(acc, 90000);
      if (!hasKey) { acc.starting = false; saveState(); render(); return; }
      const ok = await startRealStream(acc);
      acc.starting = false;
      if (ok) {
        acc.streaming = !acc.connecting;
        acc.status = acc.streaming ? 'live' : 'connected';
        acc.liveStartedAt = acc.streaming ? Date.now() : null;
        saveState();
        render();
        showToast(acc.connecting ? '正在连接推流服务器' : '推流已启动', acc.connecting ? 'info' : 'success');
        addLog(roomLabel + (acc.connecting ? ' 正在连接推流服务器' : ' 已开始输出'));
      } else {
        saveState(); render();
      }
    } catch (e) {
      acc.starting = false;
      saveState(); render();
      addLog(roomLabel + ' 推流启动异常: ' + e.message);
    }
  });
}

function generateReplySuggestions(comment, lang) {
  const c = (comment || '').toLowerCase();
  const t = REPLY_TEMPLATES[lang] || REPLY_TEMPLATES['英语(美区)'];
  let pool = t.general;
  if (/(price|cost|how much|\$|多少钱|价格|价位)/.test(c)) pool = t.price;
  else if (/(where.*buy|link|链接|哪里买|购买|shop|store)/.test(c)) pool = t.link;
  else if (/(ship|deliver|物流|发货|邮)/.test(c)) pool = t.shipping;
  else if (/(love|great|amazing|nice|wow|cute|喜欢|好看|可爱|棒)/.test(c)) pool = t.praise;
  else if (/(size|尺码|号码|颜色|color)/.test(c)) pool = t.size;
  return pool.slice(0, 3);
}
